<style>
:root{
	--bg:#f1f1f4; --surface:#ffffff; --surface-2:#e9e9ee; --surface-3:#dfdfe6;
	--ink:#101015; --ink-2:#43434e; --ink-3:#71717f; --line:#dcdce4;
	--acc:#16323a; --acc-soft:#e2e8ea; --acc-ink:#16323a;
	--sig:#c0436a; --sig-soft:#f7e2e9; --sig-ink:#a8355b;
	--ok:#1c7a72; --ok-soft:#dbeeec; --ok-ink:#166761;
	--warn:#8d6008; --warn-soft:#f6ead0;
	--sans:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
	--serif:"Gowun Batang","Nanum Myeongjo",Georgia,serif;
	--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
	--r:10px; --r-lg:20px; --r-xl:24px;
	--e1:0 1px 2px rgba(16,16,24,.05);
	--e2:0 1px 2px rgba(16,16,24,.05),0 12px 28px -18px rgba(16,16,24,.3);
	--e3:0 2px 8px rgba(16,16,24,.07),0 30px 60px -30px rgba(16,16,24,.4);
}
@media (max-width:720px){.taskgrid{grid-template-columns:1fr}}
@media (prefers-color-scheme:dark){
	:root:not([data-theme="light"]){
		--bg:#0b0b0e; --surface:#15151b; --surface-2:#1e1e26; --surface-3:#282832;
		--ink:#eeeef4; --ink-2:#b2b2c0; --ink-3:#7c7c8c; --line:#282831;
		--acc:#e6edef; --acc-soft:#1e2a2e; --acc-ink:#cfe0e2;
		--sig:#ef8fa8; --sig-soft:#2c1720; --sig-ink:#f4a9bc;
		--ok:#55bdb4; --ok-soft:#12262a; --ok-ink:#74d0c6;
		--warn:#dda94a; --warn-soft:#2a2213;
		--e1:0 1px 2px rgba(0,0,0,.5);
		--e2:0 1px 2px rgba(0,0,0,.5),0 14px 30px -20px rgba(0,0,0,.85);
		--e3:0 2px 8px rgba(0,0,0,.55),0 34px 64px -32px rgba(0,0,0,.9);
	}
}
:root[data-theme="dark"]{
	--bg:#0b0b0e; --surface:#15151b; --surface-2:#1e1e26; --surface-3:#282832;
	--ink:#eeeef4; --ink-2:#b2b2c0; --ink-3:#7c7c8c; --line:#282831;
	--acc:#e6edef; --acc-soft:#1e2a2e; --acc-ink:#cfe0e2;
	--sig:#ef8fa8; --sig-soft:#2c1720; --sig-ink:#f4a9bc;
	--ok:#55bdb4; --ok-soft:#12262a; --ok-ink:#74d0c6;
	--warn:#dda94a; --warn-soft:#2a2213;
	--e1:0 1px 2px rgba(0,0,0,.5);
	--e2:0 1px 2px rgba(0,0,0,.5),0 14px 30px -20px rgba(0,0,0,.85);
	--e3:0 2px 8px rgba(0,0,0,.55),0 34px 64px -32px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.62;letter-spacing:-.02em;-webkit-font-smoothing:antialiased}
button{font-family:inherit;letter-spacing:-.02em}
:focus-visible{outline:2px solid var(--sig);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- app shell ---------- */
.app{display:flex;min-height:100vh}
.side{position:fixed;top:0;left:0;bottom:0;width:268px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;transition:transform .3s cubic-bezier(.32,.72,.16,1)}
.side-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:22px 20px 14px}
.side-title{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.14;letter-spacing:-.03em;margin-top:7px}
.side-x{display:none;border:none;background:none;color:var(--ink-3);font-size:17px;cursor:pointer;padding:2px 4px}
.side-search{padding:0 16px 10px}
.side-search .txtin{font-size:13px;padding:9px 12px;border-radius:8px}
.side-nav{flex:1;overflow-y:auto;padding:2px 12px 14px}
.nav-sec{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase;padding:18px 8px 7px;font-weight:600}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:none;color:var(--ink-2);font-family:var(--sans);font-size:13.5px;padding:9px 10px;border-radius:8px;cursor:pointer;letter-spacing:-.02em;line-height:1.34}
.nav-i:hover{background:var(--surface-2);color:var(--ink)}
.nav-i.on{background:var(--sig-soft);color:var(--sig-ink);font-weight:700}
.nav-i .nn{font-family:var(--mono);font-size:11px;color:var(--ink-3);min-width:17px;font-variant-numeric:tabular-nums;flex:none}
.nav-i.on .nn{color:var(--sig-ink)}
.nav-i.done .nn{color:var(--ok)}
.nav-i.dim{opacity:.4;cursor:default}
.nav-i.dim:hover{background:none;color:var(--ink-2)}
.nav-i .badge{margin-left:auto;font-family:var(--mono);font-size:9.5px;background:var(--sig);color:#fff;border-radius:99px;padding:2px 7px;flex:none}
.side-foot{border-top:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:12px}
.side-prog{flex:1;min-width:0}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
.main{flex:1;margin-left:268px;min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:13px 24px;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border-bottom:1px solid var(--line)}
.burger{display:none;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:14px;border-radius:8px;width:36px;height:36px;cursor:pointer}
.crumb{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
.topspacer{flex:1}
.view{max-width:760px;margin:0 auto;padding:34px 24px 96px}
.home{padding:0}
.empty{padding:26px 0;color:var(--ink-3);font-size:14.5px}
.ncard{border:1px solid var(--line);border-radius:var(--r-xl);padding:20px 22px;background:var(--surface);margin-bottom:12px}
.ncard .nd{font-family:var(--mono);font-size:11px;color:var(--sig-ink);letter-spacing:.08em;font-weight:600}
.ncard h4{font-family:var(--serif);font-size:19px;font-weight:700;margin:7px 0 8px;letter-spacing:-.03em}
.ncard p{margin:0;font-size:14.5px;color:var(--ink-2);line-height:1.66}
.ncard a{display:inline-block;margin-top:12px;font-size:13.5px;font-weight:700;color:var(--sig-ink);text-decoration:none;border-bottom:1px solid var(--sig)}
.mgroup{margin-bottom:26px}
.mgroup h4{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase;margin:0 0 10px;font-weight:600}
.mitem{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 18px;background:var(--surface);margin-bottom:9px;text-decoration:none;color:var(--ink);font-size:15px;font-weight:500;transition:border-color .15s,transform .16s}
.mitem:hover{border-color:var(--sig);transform:translateX(3px)}
.mitem .arw{margin-left:auto;color:var(--ink-3);font-family:var(--mono);font-size:13px}
.mitem.nolink{opacity:.7;pointer-events:none}
@media (max-width:900px){
	.side{transform:translateX(-100%);box-shadow:var(--e3)}
	.app.nav-open .side{transform:none}
	.app.nav-open .scrim{display:block}
	.side-x{display:block}
	.main{margin-left:0}
	.burger{display:block}
	.view{padding:26px 20px 90px}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

/* ---------- hero ---------- */
.mast{padding:26px 0 34px;border-bottom:1px solid var(--line)}
.mast-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:44px}
.code{font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;color:var(--ink-3);font-weight:600;text-transform:uppercase}
.theme-btn{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink-2);font-family:var(--mono);font-size:11px;letter-spacing:.1em;border-radius:99px;padding:7px 15px;cursor:pointer;text-transform:uppercase}
.theme-btn:hover{border-color:var(--sig);color:var(--sig-ink)}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(42px,9vw,74px);line-height:.98;margin:0 0 .28em;letter-spacing:-.035em;text-wrap:balance}
.tagline{margin:0;color:var(--ink-2);font-size:16px;max-width:44ch;line-height:1.68}
.mast-meta{margin-top:26px;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase}

/* ---------- progress ---------- */
.summary{display:grid;grid-template-columns:1fr auto auto;gap:18px 20px;align-items:center;margin:26px 0 0;padding:22px 0 24px;border-bottom:1px solid var(--line)}
@media (max-width:600px){.summary{grid-template-columns:1fr auto}.summary .go{grid-column:1/-1}}
.summary .lab{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--sig-ink);font-weight:600;text-transform:uppercase}
.summary .nextline{font-family:var(--serif);font-size:23px;font-weight:700;margin-top:5px;letter-spacing:-.02em;text-wrap:balance}
.sum-num{font-family:var(--mono);font-size:40px;font-weight:600;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.sum-num i{font-style:normal;font-size:17px;color:var(--ink-3);letter-spacing:-.02em}
.summary .go{border:none;background:var(--acc);color:var(--bg);font-size:14.5px;font-weight:700;border-radius:var(--r);padding:13px 26px;cursor:pointer;white-space:nowrap;transition:transform .16s,opacity .16s}
.summary .go:hover{transform:translateY(-1px);opacity:.88}
.pbar{grid-column:1/-1;display:flex;align-items:center;gap:14px}
.ptrack{flex:1;height:3px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.pfill{height:100%;width:0;background:var(--sig);border-radius:99px;transition:width .55s cubic-bezier(.32,.72,.16,1)}
.ptxt{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.02em}

/* ---------- week list ---------- */
.blockhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:44px 0 14px}
.blockhead h2{font-family:var(--serif);font-size:21px;font-weight:700;margin:0;letter-spacing:-.025em}
.blockhead .rng{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
.weeks{display:grid;gap:10px}
.wk{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:18px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:18px 22px;cursor:pointer;font-family:var(--sans);color:var(--ink);transition:border-color .16s,transform .18s cubic-bezier(.32,.72,.16,1),background .16s}
.wk:hover{border-color:var(--sig);transform:translateY(-2px)}
.wk .no{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--ink-3);letter-spacing:-.04em;font-variant-numeric:tabular-nums;transition:color .16s}
.wk:hover .no{color:var(--sig)}
.wk.done .no{color:var(--ok)}
.wk .t{font-size:16.5px;font-weight:700;display:block;letter-spacing:-.025em}
.wk .s{font-size:13px;color:var(--ink-3);display:block;margin-top:2px;letter-spacing:-.015em}
.wk .st{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap;letter-spacing:.1em;text-transform:uppercase}
.wk.done .st{color:var(--ok-ink);font-weight:600}
.wk.now{border-color:var(--sig);background:var(--surface)}
.wk.now .no{color:var(--sig)}
.wk.now .st{color:var(--sig-ink);font-weight:600}
.wk.exam{cursor:default;background:transparent;border-style:dashed;opacity:.62}
.wk.exam:hover{border-color:var(--line);transform:none}
.homefoot{margin-top:46px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-3)}
.linkbtn{border:1px solid var(--line);background:transparent;color:var(--ink-2);font-size:12px;border-radius:99px;padding:8px 15px;cursor:pointer}
.linkbtn:hover{border-color:var(--sig);color:var(--sig-ink)}

/* ---------- lesson ---------- */
.lbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border-bottom:1px solid var(--line)}
.lbar-in{max-width:740px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.back{border:none;background:none;color:var(--ink);font-size:14.5px;font-weight:700;cursor:pointer;padding:0;letter-spacing:-.02em}
.back:hover{color:var(--sig-ink)}
.lbar .wknum{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.12em}
.lbody{max-width:740px;margin:0 auto;padding:30px 22px 80px}
.lhead .wkbig{font-family:var(--mono);font-size:clamp(56px,15vw,88px);font-weight:400;line-height:.85;letter-spacing:-.06em;color:var(--sig);opacity:.28;margin-bottom:6px}
.lhead .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--sig-ink);font-weight:600;text-transform:uppercase}
.lhead h2{font-family:var(--serif);font-size:clamp(28px,6vw,42px);font-weight:700;margin:.16em 0 .2em;line-height:1.06;letter-spacing:-.035em;text-wrap:balance}
.lhead p{margin:0;color:var(--ink-2);font-size:15.5px}
.goal{margin:22px 0 0;padding:18px 20px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--sig);font-size:15px}
.goal b{color:var(--sig-ink)}

.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);margin-top:18px;overflow:hidden}
.block-in{padding:22px}
.bh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bh .tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;font-weight:600;padding:4px 9px;border-radius:6px;background:var(--surface-2);color:var(--ink-3);text-transform:uppercase}
.bh .tag.p{background:var(--acc-soft);color:var(--acc-ink)}
.bh .tag.o{background:var(--sig-soft);color:var(--sig-ink)}
.bh .tag.c{background:var(--ok-soft);color:var(--ok-ink)}
.bh h3{font-size:17px;font-weight:700;margin:0;letter-spacing:-.03em}
.lead{color:var(--ink-2);font-size:15px;margin:0 0 16px;line-height:1.66}
.lead b{color:var(--ink)}

.q{font-size:16.5px;font-weight:700;margin:0 0 13px;line-height:1.5;letter-spacing:-.025em}
.opts{display:grid;gap:9px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;border-radius:var(--r);padding:13px 16px;cursor:pointer;transition:border-color .14s,background .14s,transform .16s}
.opt:hover:not(:disabled){border-color:var(--sig);transform:translateX(3px)}
.opt:disabled{cursor:default}
.opt.pick-ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-ink);font-weight:700}
.opt.pick-no{border-color:var(--sig);background:var(--sig-soft);color:var(--sig-ink)}
.fb{display:none;margin-top:14px;font-size:14.5px;line-height:1.66;padding:15px 17px;border-radius:var(--r-lg)}
.fb.show{display:block}

 no:"답은 ②번입니다. ‘무료’를 막으면 ‘무료 배송 안내’ 같은 정상 문자도 막힙니다. 광고 쪽은 단어를 띄어 써서 규칙을 피해 갑니다."},
 observe:["규칙기반(rule-based)은 두 가지로 실패합니다. 광고를 놓치는 <b>거짓 음성</b>과 정상 문자를 막는 <b>거짓 양성</b>입니다.","단어를 띄어 쓰면(대 출) 규칙을 그냥 지나갑니다. 사람은 다 알아보는데도 그렇습니다.","학습기반(learning-based)은 규칙을 쓸 필요가 없습니다. <b>광고인지 아닌지 표시만</b> 해 주면 됩니다.","규칙은 ‘이 단어 때문’이라고 <b>한 단어를 집을 수 있습니다</b>. 기계는 못 집습니다. 단어 하나를 빼도 답이 잘 바뀌지 않습니다.","기계가 이유를 숨기는 것이 아닙니다. 이유가 <b>여러 단어에 조금씩 흩어져</b> 있는 것입니다."],
 key:"규칙기반은 <b>사람이 규칙을 씁니다</b>. 학습기반은 <b>사람이 답만 알려 주고, 규칙은 기계가 찾습니다</b>. 그래서 성능은 좋아졌지만, 이유를 한 줄로 말하기는 어려워졌습니다.",

 ok:"맞습니다. 실습에서 단어를 하나씩 빼 봐도 답이 잘 바뀌지 않았습니다. 이 문제를 다루는 시간이 12주 설명가능한 AI(XAI)입니다.",no:"답은 ②번입니다. 단어를 하나 빼도 답이 잘 바뀌지 않았던 것을 떠올려 보세요. 이유가 한 곳에 없습니다."}},

{n:3,block:"기초·원리",title:"머신러닝",sub:"데이터에서 배우는 기계 · 편향 확인",stage:"classifier",
 goal:"내 사진을 두 무리로 나누어 넣고 기계를 학습시킵니다. 기계가 무엇을 배웠는지 보고, 자료가 치우치면 어떻게 되는지 확인합니다.",
 predict:{q:"고양이 사진 20장과 개 사진 3장으로 학습시키면 어떻게 될까요?",opts:["전체 정확도가 오르니 괜찮습니다","개를 자주 틀립니다. 그런데 전체 정확도만 보면 그 사실이 잘 안 보입니다"],a:1,
 ok:"맞습니다. 적게 배운 쪽을 자주 틀립니다. 전체 평균만 보면 이 문제가 가려집니다.",
 no:"답은 ②번입니다. 적게 배운 쪽을 자주 틀립니다. 그런데 전체 평균만 보면 그 사실이 가려집니다. 이것이 편향(bias)이 숨는 방식입니다."},
 observe:["기계는 규칙을 받지 않았습니다. <b>내가 넣은 사진을 보고 스스로 패턴을 찾습니다</b>.","‘배운 모양’은 같은 종류 사진을 겹쳐 평균을 낸 것입니다. 사진을 바꾸면 배운 모양도 바뀝니다.","치우친 자료로 배우면 치우친 판단을 합니다. 적게 배운 쪽은 사진 한두 장을 거의 그대로 외웁니다.","<b>색과 밝기만 보는 방법으로는 고양이와 개를 나눌 수 없습니다.</b> 그래서 다음 주에 더 나은 방법을 배웁니다."],
 key:"기계의 판단은 <b>내가 넣은 자료가 어떻게 모였는가</b>에 달려 있습니다. 자료가 곧 규칙입니다.",
 check:{q:"지도학습(supervised learning)은 무엇일까요?",opts:["정답을 붙여 둔 예시로 배웁니다","정답 없이 비슷한 것끼리 묶습니다","잘하면 상, 못하면 벌을 주며 배웁니다","사람이 규칙을 직접 넣습니다"],a:0,
 ok:"맞습니다. ②번은 비지도학습, ③번은 강화학습입니다.",no:"답은 ①번입니다. ②번은 비지도학습, ③번은 강화학습, ④번은 규칙기반입니다."}},

{n:4,block:"기초·원리",title:"신경망과 딥러닝",sub:"가중치와 임계값을 스스로 찾아가는 과정",stage:"neuron",

{n:16,exam:true,block:"마무리",title:"기말고사",sub:"필기시험 · 9~14주"}
];
var BLOCKS=[{name:"기초·원리",rng:"1–6주 · 중간고사 범위"},{name:"중간 점검",rng:"7–8주"},{name:"활용·성찰",rng:"9–14주 · 기말고사 범위"},{name:"마무리",rng:"15–16주"}];
function wk(n){for(var i=0;i<WEEKS.length;i++)if(WEEKS[i].n===n)return WEEKS[i];return null;}
var LESSONS=WEEKS.filter(function(w){return !w.exam;});
var LNUMS=LESSONS.map(function(w){return w.n;});

/* ---------- 목차 · 라우터 ---------- */
var COURSE=(window.COURSE&&typeof window.COURSE==="object")?window.COURSE:{};
var NOTICES=COURSE.notices||[],MATERIALS=COURSE.materials||[];
var view=$("#view"),sideNav=$("#sideNav"),app=$("#app");
var here={t:"home",n:0};
var root=document.documentElement;
function cv(n){return getComputedStyle(root).getPropertyValue(n).trim();}

function setNav(on){app.classList.toggle("nav-open",!!on);}
$("#burger").addEventListener("click",function(){setNav(true);});
$("#sideX").addEventListener("click",function(){setNav(false);});
$("#scrim").addEventListener("click",function(){setNav(false);});
$("#themeBtn").addEventListener("click",function(){
	var dark=root.getAttribute("data-theme")==="dark"||(!root.getAttribute("data-theme")&&window.matchMedia("(prefers-color-scheme:dark)").matches);
	root.setAttribute("data-theme",dark?"light":"dark");
	document.dispatchEvent(new CustomEvent("themechange"));
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")setNav(false);});

function hashOf(){var h=location.hash||"";return h.charAt(0)==="#"?h.substring(1):h;}
var lastRoute=null;
function render(h){
	h=h||"/";
	if(h.indexOf("/week/")===0){
		var n=parseInt(h.substring(6),10);
		if(wk(n)&&!wk(n).exam)renderWeek(n);else renderHome();
	}
	else if(h.indexOf("/notices")===0)renderNotices();
	else if(h.indexOf("/materials")===0)renderMaterials();
	else if(h.indexOf("/notes")===0)renderNotes();
	else renderHome();
	lastRoute=h;
	setNav(false);
	window.scrollTo(0,0);
	renderNav();
}
function go(h){
	try{if(hashOf()!==h)location.hash="#"+h;}catch(e){}
	render(h);
}
function openWeek(n){go("/week/"+n);}
function closeWeek(){go("/");}
function route(){render(hashOf());}
window.addEventListener("hashchange",function(){
	var h=hashOf()||"/";
	if(h!==lastRoute)render(h);
});

function progressCount(){return LESSONS.filter(function(w){return progress[w.n];}).length;}
function updateProgress(){
	var done=progressCount();
	$("#pFill").style.width=(done/LESSONS.length*100).toFixed(1)+"%";
	$("#pTxt").textContent=done+" / "+LESSONS.length+"주차 끝냄";
	var pn=$("#pNum");if(pn)pn.textContent=(done<10?"0":"")+done;
}
function nextWeek(){for(var i=0;i<LESSONS.length;i++)if(!progress[LESSONS[i].n])return LESSONS[i];return LESSONS[LESSONS.length-1];}

/* ---------- 사이드바 ---------- */
function navItem(opt){
	var b=el("button","nav-i"+(opt.on?" on":"")+(opt.done?" done":"")+(opt.dim?" dim":""));
	if(opt.num!=null)b.appendChild(el("span","nn",opt.num));
	b.appendChild(el("span",null,opt.label));
	if(opt.badge)b.appendChild(el("span","badge",String(opt.badge)));
	if(opt.dim)b.disabled=true;else b.addEventListener("click",opt.act);
	return b;
}
function renderNav(){
	sideNav.innerHTML="";
	var q=($("#navSearch")&&$("#navSearch").value||"").trim();
	if(!q){
		sideNav.appendChild(navItem({label:"개요",on:here.t==="home",act:function(){go("/");}}));
		sideNav.appendChild(navItem({label:"공지",on:here.t==="notices",badge:NOTICES.length||null,act:function(){go("/notices");}}));
		sideNav.appendChild(navItem({label:"자료",on:here.t==="materials",act:function(){go("/materials");}}));
		sideNav.appendChild(navItem({label:"노트 인쇄",on:here.t==="notes",act:function(){go("/notes");}}));
	}
	BLOCKS.forEach(function(b){
		var rows=WEEKS.filter(function(w){
			if(w.block!==b.name)return false;
			if(!q)return true;
			return (w.title+" "+w.sub+" "+(w.goal||"")).indexOf(q)>=0;
		});
		if(!rows.length)return;
		sideNav.appendChild(el("div","nav-sec",b.name));
		rows.forEach(function(w){
			sideNav.appendChild(navItem({
				num:(w.n<10?"0":"")+w.n,
				label:w.title,
				on:here.t==="week"&&here.n===w.n,
				done:!!progress[w.n],
				dim:!!w.exam,
				act:function(){openWeek(w.n);}
			}));
		});
	});
}
if($("#navSearch"))$("#navSearch").addEventListener("input",renderNav);

/* ---------- 개요 ---------- */
function renderHome(){
	here={t:"home",n:0};
	$("#crumb").textContent="개요";
	$("#lWk").textContent="";
	view.innerHTML="";
	var home=el("div","home");
	var mast=el("header","mast");
	var top=el("div","mast-top");
	top.appendChild(el("div","code","GEA8811 · 2026-2"));
	mast.appendChild(top);
	var h1=el("h1");h1.innerHTML="인공지능<br>실습판";mast.appendChild(h1);
	mast.appendChild(el("p","tagline","주차마다 실습이 하나씩 있습니다. 개념을 직접 만져 보면서 확인합니다. 코딩이나 수학은 몰라도 됩니다."));
	mast.appendChild(el("div","mast-meta","인문사회계열을위한인공지능입문 · 국립창원대학교"));
	home.appendChild(mast);

	var nx=nextWeek(),done=progressCount();
	var sum=el("section","summary");
	var left=el("div","sum-left");
	left.appendChild(el("div","lab","다음 작업"));
	left.appendChild(el("div","nextline",nx.n+"주차 — "+nx.title));
	sum.appendChild(left);
	var num=el("div","sum-num");
	var sp=el("span",null,(done<10?"0":"")+done);sp.id="pNum";
	num.appendChild(sp);num.appendChild(el("i",null,"/"+LESSONS.length));
	sum.appendChild(num);
	var gob=el("button","go","열기");
	gob.addEventListener("click",function(){openWeek(nextWeek().n);});
	sum.appendChild(gob);
	home.appendChild(sum);

	if(NOTICES.length){
		var nh=el("div","blockhead");
		nh.appendChild(el("h2",null,"공지"));
		var more=el("span","rng","전체 보기");
		nh.appendChild(more);
		home.appendChild(nh);
		NOTICES.slice(0,3).forEach(function(nt){home.appendChild(noticeCard(nt));});
		var mb=el("button","btn gray","공지 전체 보기");
		mb.addEventListener("click",function(){go("/notices");});
		var mr=el("div","btnrow");mr.appendChild(mb);home.appendChild(mr);
	}

	BLOCKS.forEach(function(b){
		var h=el("div","blockhead");h.appendChild(el("h2",null,b.name));
		var mine=WEEKS.filter(function(w){return w.block===b.name&&!w.exam;});
		var md=mine.filter(function(w){return progress[w.n];}).length;
		h.appendChild(el("span","rng",mine.length?(md+"/"+mine.length+" · "+b.rng):b.rng));
		home.appendChild(h);
		var g=el("div","weeks");
		WEEKS.filter(function(w){return w.block===b.name;}).forEach(function(w){
			var btn=el("button","wk"+(w.exam?" exam":"")+(progress[w.n]?" done":"")+(!w.exam&&w.n===nx.n?" now":""));
			btn.appendChild(el("span","no",(w.n<10?"0":"")+w.n));
			var mid=el("span");
			mid.appendChild(el("b","t",w.title));
			mid.appendChild(el("span","s",w.sub));
			btn.appendChild(mid);
			btn.appendChild(el("span","st",w.exam?"시험":progress[w.n]?"완료":(w.n===nx.n?"다음 작업":"")));

/* ---------- 공통 블록 ---------- */
function block(tag,label,title){
	var b=el("section","block"),inn=el("div","block-in");b.appendChild(inn);
	var h=el("div","bh");h.appendChild(el("span","tag "+tag,label));h.appendChild(el("h3",null,title));inn.appendChild(h);
	b.inner=inn;return b;
}
function quizBlock(spec,tag,label,title,onRight){
	var b=block(tag,label,title),inn=b.inner;
	inn.appendChild(el("p","q",spec.q));
	var wrap=el("div","opts");inn.appendChild(wrap);
	var fb=el("div","fb");inn.appendChild(fb);
	var tries=0,settled=false;
	spec.opts.forEach(function(o,i){
		var btn=el("button","opt",o);
		btn.addEventListener("click",function(){
			if(settled)return;
			var right=(i===spec.a);
			var all=wrap.querySelectorAll(".opt");
			if(right){
				settled=true;
				for(var k=0;k<all.length;k++)all[k].disabled=true;
				btn.classList.add("pick-ok");
				fb.className="fb show ok";
				fb.innerHTML="<b>"+(tries?"두 번째에 맞혔습니다":"정답입니다")+"</b> "+spec.ok;
				if(onRight)onRight(true);
				return;
			}
			tries++;
			btn.classList.add("pick-no");
			btn.disabled=true;
			if(tries===1){
				fb.className="fb show no";
				fb.innerHTML="<b>다시 한 번</b> 아직 정답이 아닙니다. 오늘 배운 내용을 떠올리며 한 번 더 골라 보세요.";
			}else{
				settled=true;
				for(var k2=0;k2<all.length;k2++)all[k2].disabled=true;
				all[spec.a].classList.add("pick-ok");
				fb.className="fb show no";
				fb.innerHTML="<b>정답을 확인해 보세요</b> "+spec.no;
				if(onRight)onRight(false);
			}
		});
		wrap.appendChild(btn);
	});
	return b;
}
function ctlRow(parent,label,min,max,step,val,fmt,onIn){
	var row=el("div","ctl");
	var id="c"+Math.floor(val*1e6)+label.length+parent.children.length;
	var lab=el("label",null,label);lab.setAttribute("for",id);
	var inp=document.createElement("input");inp.type="range";inp.id=id;inp.min=min;inp.max=max;inp.step=step;inp.value=val;
	var out=el("output",null,fmt(val));
	inp.addEventListener("input",function(){out.textContent=fmt(+inp.value);onIn(+inp.value);});
	row.appendChild(lab);row.appendChild(inp);row.appendChild(out);parent.appendChild(row);
	return inp;
}
function metric(k,v,cls){var m=el("div","metric"+(cls?" "+cls:""));m.appendChild(el("div","k",k));var vv=el("div","v",v);m.appendChild(vv);m.val=vv;return m;}
function pixgrid(size,cell,ro){
	var g=el("div","pix"+(ro?" ro":""));g.style.gridTemplateColumns="repeat("+size+","+cell+"px)";
	g.cells=[];
	for(var i=0;i<size*size;i++){var c=el("div","px");c.style.width=cell+"px";c.style.height=cell+"px";g.appendChild(c);g.cells.push(c);}
	return g;
}
function paintable(g,size,onChange){
	var down=false;
	function set(t,on){var i=g.cells.indexOf(t);if(i<0)return;g.cells[i].classList.toggle("on",on);onChange();}
	g.addEventListener("pointerdown",function(e){down=true;g.setPointerCapture(e.pointerId);var t=e.target;set(t,!t.classList.contains("on"));});
	g.addEventListener("pointermove",function(e){if(!down)return;var t=document.elementFromPoint(e.clientX,e.clientY);if(t&&t.classList.contains("px"))set(t,true);});
	window.addEventListener("pointerup",function(){down=false;});
}
function gridVals(g){return g.cells.map(function(c){return c.classList.contains("on")?1:0;});}
function setGrid(g,arr){g.cells.forEach(function(c,i){c.classList.toggle("on",!!arr[i]);});}

function notePage(w){
	var art=el("article","note-page");
	var hd=el("div","np-head");
	hd.appendChild(el("div","np-code","GEA8811 · 인문사회계열을위한인공지능입문"));
	hd.appendChild(el("div","np-title",(w.n<10?"0":"")+w.n+"주차 · "+w.title));
	hd.appendChild(el("div","np-id","학과 ____________   학번 ____________   이름 ____________"));
	art.appendChild(hd);

	var data=NOTES[w.n]||{c:[],sa:[],q:""};

	var s1=el("section","np-sec");
	s1.appendChild(el("h5",null,"① 오늘의 개념"));
	var dl=el("div","np-terms");
	(data.c||[]).forEach(function(c){
		var box=el("div","np-term");
		var h=el("div","np-t");
		h.appendChild(el("b",null,c.t));
		h.appendChild(el("span","np-en",c.e));
		box.appendChild(h);
		box.appendChild(el("div","np-d",c.d));
		box.appendChild(el("div","np-s",c.s));
		dl.appendChild(box);
	});
	s1.appendChild(dl);
	art.appendChild(s1);

	var s2=el("section","np-sec");
	s2.appendChild(el("h5",null,"② 짧게 답하기"));
	var sl=el("div","np-sas");
	(data.sa||[]).forEach(function(q,i){
		var row=el("div","np-sa");
		row.appendChild(el("span","np-qn",String(i+1)));
		row.appendChild(el("span","np-sq",q));
		row.appendChild(el("i"));
		sl.appendChild(row);
	});
	s2.appendChild(sl);
	art.appendChild(s2);

	var s3=el("section","np-sec");
	s3.appendChild(el("h5",null,"③ 생각을 펼쳐 쓰기"));
	var head=el("div","np-qh");
	head.appendChild(el("span","np-qn","4"));
	head.appendChild(el("span",null,data.q||""));
	s3.appendChild(head);
	for(var k=0;k<4;k++)s3.appendChild(el("div","np-line"));
	art.appendChild(s3);
	return art;
}

	function train(){
		var spam={},ham={},ns=0,nh=0,vocab={},used=0;
		MSG.forEach(function(m,i){
			if(label[i]===null)return;
			used++;
			words(m.t).forEach(function(w){
				vocab[w]=1;
				if(label[i]===1){spam[w]=(spam[w]||0)+1;ns++;}
				else{ham[w]=(ham[w]||0)+1;nh++;}
			});
		});
		if(used<8)return null;
		var V=Object.keys(vocab).length,sc={};
		Object.keys(vocab).forEach(function(w){
			sc[w]=Math.log((((spam[w]||0)+1)/(ns+V))/((((ham[w]||0)+1))/(nh+V)));
		});
		return {sc:sc,used:used,V:V};
	}
	function machJudge(t,skip){

STAGES.classifier=function(root){
	var N=24,G=12;
	var labels=["고양이","개"];
	var samples=[],pending=[],model=null,mode=0;

	var lead=el("p","lead");
	lead.innerHTML="사진을 두 무리로 나누어 넣으면, 기계가 스스로 구분하는 법을 배웁니다. 폰이나 노트북에 있는 사진을 쓰면 됩니다.";
	root.appendChild(lead);

	/* ---------- 도구 ---------- */
	function ro(w){var c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+"로";var j=(c-0xAC00)%28;return w+((j===0||j===8)?"로":"으로");}
	function center(v){var m=0,i;for(i=0;i<v.length;i++)m+=v[i];m/=v.length;var d=new Array(v.length);for(i=0;i<v.length;i++)d[i]=v[i]-m;return d;}
	function unit(v){var n=0,i;for(i=0;i<v.length;i++)n+=v[i]*v[i];n=Math.sqrt(n);if(n<1e-9)return v;var d=new Array(v.length);for(i=0;i<v.length;i++)d[i]=v[i]/n;return d;}
	function cos(a,b){var s=0;for(var i=0;i<a.length;i++)s+=a[i]*b[i];return s;}
	function feats(rgb){
		var pix=new Array(N*N*3),hist=new Array(18).fill(0),i;
		for(i=0;i<N*N;i++){
			var r=rgb[i*3],g=rgb[i*3+1],b=rgb[i*3+2];
			pix[i*3]=r;pix[i*3+1]=g;pix[i*3+2]=b;
			var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0;
			if(d>0.04){
				if(mx===r)h=((g-b)/d+6)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;
				hist[Math.min(11,Math.floor(h/6*12))]+=d;
			}
			hist[12+Math.min(5,Math.floor(mx*6))]+=1;
		}
		return {p:unit(center(pix)),h:unit(center(hist))};
	}
	function centroid(y,skip){
		var P=new Array(N*N*3).fill(0),H=new Array(18).fill(0),c=0;
		samples.forEach(function(sp,i){
			if(i===skip||sp.y!==y)return;
			var f=sp.f;
			for(var k=0;k<P.length;k++)P[k]+=f.p[k];
			for(var q=0;q<18;q++)H[q]+=f.h[q];
			c++;
		});
		if(!c)return null;
		return {p:unit(P),h:unit(H)};
	}
	function judge(f,cens){
		function sc(c){return c?0.62*cos(f.p,c.p)+0.38*cos(f.h,c.h):-2;}
		var a=sc(cens[0]),b=sc(cens[1]);
		var wa=Math.exp(a*8),wb=Math.exp(b*8);
		return {y:a>=b?0:1,pa:wa/(wa+wb)*100,pb:wb/(wa+wb)*100,margin:Math.abs(a-b)};
	}
	function rgbCanvas(rgb,px,ring){
		var c=document.createElement("canvas");c.width=N;c.height=N;
		var x=c.getContext("2d"),img=x.createImageData(N,N);
		for(var i=0;i<N*N;i++){
			img.data[i*4]=Math.max(0,Math.min(255,Math.round(rgb[i*3]*255)));
			img.data[i*4+1]=Math.max(0,Math.min(255,Math.round(rgb[i*3+1]*255)));
			img.data[i*4+2]=Math.max(0,Math.min(255,Math.round(rgb[i*3+2]*255)));
			img.data[i*4+3]=255;
		}
		x.putImageData(img,0,0);
		var o=document.createElement("canvas");o.width=px;o.height=px;
		var oc=o.getContext("2d");oc.imageSmoothingEnabled=false;oc.drawImage(c,0,0,px,px);
		o.style.width=px+"px";o.style.height=px+"px";o.style.borderRadius="7px";o.style.display="block";
		if(ring)o.style.boxShadow="0 0 0 2.5px "+ring;
		return o;
	}
	function imgToRgb(im){
		var c=document.createElement("canvas");c.width=N;c.height=N;
		var x=c.getContext("2d"),s=Math.min(im.width,im.height);
		x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,N,N);
		var d=x.getImageData(0,0,N,N).data,v=new Array(N*N*3);
		for(var i=0;i<N*N;i++){v[i*3]=d[i*4]/255;v[i*3+1]=d[i*4+1]/255;v[i*3+2]=d[i*4+2]/255;}
		return v;
	}
	function drawToRgb(bits){
		var v=new Array(N*N*3);
		for(var y=0;y<N;y++)for(var x=0;x<N;x++){
			var on=bits[Math.floor(y/2)*G+Math.floor(x/2)]?0:1;
			var i=y*N+x;v[i*3]=on;v[i*3+1]=on;v[i*3+2]=on;
		}
		return v;
	}

	/* ---------- 종류 이름 ---------- */
	var nameWrap=el("div");
	nameWrap.style.display="grid";nameWrap.style.gridTemplateColumns="1fr 1fr";nameWrap.style.gap="10px";nameWrap.style.margin="0 0 14px";
	[0,1].forEach(function(i){
		var box=el("div");
		box.appendChild(el("div","note","종류 "+(i+1)+" 이름"));
		var inp=document.createElement("input");inp.className="txtin";inp.value=labels[i];
		inp.addEventListener("input",function(){labels[i]=inp.value.trim()||("종류 "+(i+1));renderAll();});

STAGES.neuron=function(root){

	root.appendChild(lead);
	var PTS=[];
	var w1=0.2,w2=0.1,b=0,lr=0.1,timer=null,steps=0,put=1;

	var ch=el("div","chips");
	["불합격 점 찍기","합격 점 찍기"].forEach(function(t,i){
		var c=el("button","chip",t);c.setAttribute("aria-pressed",i===1?"true":"false");
		c.addEventListener("click",function(){
			put=i;var cs=ch.querySelectorAll(".chip");
			for(var k=0;k<cs.length;k++)cs[k].setAttribute("aria-pressed",k===i?"true":"false");
		});
		ch.appendChild(c);
	});
	root.appendChild(ch);
	root.appendChild(el("div","note","그림판을 누르면 그 자리에 점이 찍힙니다. 점을 다시 누르면 지워집니다."));

	var cvs=document.createElement("canvas");cvs.width=560;cvs.height=400;
	cvs.setAttribute("aria-label","공부시간과 출석률에 따른 합격 여부");

	function py(v){return cvs.height-PAD-(v/10)*(cvs.height-PAD*1.6);}

	function uy(p){return (cvs.height-PAD-p)/(cvs.height-PAD*1.6)*10;}
	function score(p){return w1*p.x+w2*p.y+b;}
	function acc(){var n=0;PTS.forEach(function(p){if((score(p)>0?1:0)===p.c)n++;});return n;}
	cvs.addEventListener("click",function(e){

		}

		ctx.fillStyle=surf;ctx.fillRect(0,0,cvs.width,cvs.height);

		}
		ctx.globalAlpha=1;

		ctx.save();ctx.translate(px(0)-26,py(6.6));ctx.rotate(-Math.PI/2);ctx.fillText("출석률 →",0,0);ctx.restore();
		PTS.forEach(function(p){
			var ok=(score(p)>0?1:0)===p.c;
			ctx.beginPath();ctx.arc(px(p.x),py(p.y),9,0,7);

			var nn=el("div","note");
			nn.innerHTML="밝기 "+o.p.f[0]+" · 따뜻함 "+o.p.f[1]+" · 복잡함 "+o.p.f[2]+" &nbsp;→&nbsp; 글이 가리킨 숫자와의 거리 <b>"+o.d.toFixed(0)+"</b>";
			right.appendChild(nn);
			row.appendChild(right);
			card.appendChild(row);
			if(rank===0)card.style.borderColor=cv("--ok");
			listw.appendChild(card);
		});
		sres.appendChild(listw);
		var fb=el("div","fb show ok");
		fb.innerHTML="<b>거리가 가장 가까운 사진을 골랐습니다.</b> 기계는 사진에 무엇이 찍혔는지 모릅니다. 글에서 나온 숫자와 사진에서 나온 숫자가 얼마나 가까운지만 봅니다. 이것이 글과 그림을 잇는 방법입니다.<br><br>지금 우리는 숫자를 <b>3개</b>만 썼습니다. 그래서 밝기·색·무늬만 구분합니다. 실제 AI는 숫자를 <b>수백 개</b> 쓰고, 사진과 설명이 짝지어진 자료를 수억 건 배웁니다. 그래서 ‘고양이’ 같은 말도 알아듣습니다.";
		sres.appendChild(fb);
	}
	sgo.addEventListener("click",search);
	sin.addEventListener("keydown",function(e){if(e.key==="Enter")search();});

	document.addEventListener("themechange",render);
	setShape("v");
	render();
	drawPhotos();
};

	var TOOLS=["검색 도구","글 생성 AI","이미지 생성 AI","페이지 제작 도구","사람이 직접"];
	var TASKS=[
		{id:"page",t:"페이지에 담아 링크 만들기",right:3,pos:4},
		{id:"draft",t:"소개 문구 초안 쓰기",right:1,pos:2},
		{id:"check",t:"모은 내용이 사실인지 확인하기",right:4,pos:1},
		{id:"img",t:"어울리는 이미지 만들기",right:2,pos:3},
		{id:"find",t:"가게 정보와 자료 모으기",right:0,pos:0}
	];
	var order=[0,1,2,3,4];
	var tool=[null,null,null,null,null];
	var box=el("div","steps");root.appendChild(box);
	function draw(){
		box.innerHTML="";
		order.forEach(function(ti,slot){
			var task=TASKS[ti];
			var row=el("div","stepitem");
			row.appendChild(el("span","ix",String(slot+1)));
			var mid=el("span");
			mid.appendChild(el("div","lbl",task.t));
			var sel=document.createElement("select");
			sel.className="txtin";sel.style.marginTop="6px";sel.style.fontSize="13.5px";sel.style.padding="7px 10px";
			var o0=document.createElement("option");o0.value="";o0.textContent="도구 고르기";sel.appendChild(o0);
			TOOLS.forEach(function(t,i){var o=document.createElement("option");o.value=i;o.textContent=t;if(tool[ti]===i)o.selected=true;sel.appendChild(o);});
			sel.addEventListener("change",function(){tool[ti]=sel.value===""?null:+sel.value;});
			mid.appendChild(sel);
			row.appendChild(mid);
			var mv=el("span","mv");
			var up=el("button","mvb","↑"),dn=el("button","mvb","↓");
			up.addEventListener("click",function(){if(slot===0)return;var t=order[slot-1];order[slot-1]=order[slot];order[slot]=t;draw();});
			dn.addEventListener("click",function(){if(slot===order.length-1)return;var t=order[slot+1];order[slot+1]=order[slot];order[slot]=t;draw();});
			mv.appendChild(up);mv.appendChild(dn);row.appendChild(mv);
			box.appendChild(row);
		});
	}
	draw();
	var res=el("div","fb");root.appendChild(res);
	var br=el("div","btnrow");
	var run=el("button","btn","이 순서로 실행하기");
	br.appendChild(run);root.appendChild(br);
	run.addEventListener("click",function(){
		var okOrder=true;
		order.forEach(function(ti,slot){if(TASKS[ti].pos!==slot)okOrder=false;});
		var noTool=order.filter(function(ti){return tool[ti]==null;});
		var badTool=order.filter(function(ti){return tool[ti]!=null&&tool[ti]!==TASKS[ti].right;});
		var checkSlot=order.indexOf(2), draftSlot=order.indexOf(1);
		var rows=box.querySelectorAll(".stepitem");
		order.forEach(function(ti,slot){
			rows[slot].classList.remove("good","bad");
			rows[slot].classList.add(TASKS[ti].pos===slot&&tool[ti]===TASKS[ti].right?"good":"bad");
		});
		if(noTool.length){
			res.className="fb show no";
			res.innerHTML="<b>도구를 아직 안 고른 작업이 있습니다</b> 작업마다 무엇으로 할지 정해야 다음 단계로 넘길 수 있습니다.";
			return;
		}
		if(checkSlot>draftSlot){
			res.className="fb show no";
			res.innerHTML="<b>확인이 너무 늦습니다</b> 사실 확인을 초안보다 뒤에 두면, 틀린 내용이 글과 이미지와 페이지까지 그대로 갑니다. <b>확인은 앞쪽에</b> 두세요.";
			return;
		}
		if(!okOrder||badTool.length){
			res.className="fb show no";
			res.innerHTML="<b>다시 맞춰 보세요</b> 순서는 자료 모으기 → 사실 확인 → 초안 → 이미지 → 페이지입니다. 사실 확인은 <b>사람이 직접</b> 해야 합니다.";
			return;
		}
		res.className="fb show ok";
		res.innerHTML="<b>잘 이었습니다</b> 도구를 많이 쓴 것이 아니라 <b>순서와 확인 지점</b>을 정한 것이 핵심입니다. 확인 단계가 있어야 앞의 잘못이 뒤로 넘어가지 않습니다.";
	});
};

STAGES.brandcheck=function(root){
	var lead=el("p","lead");
	lead.innerHTML="같은 것을 만들어 달라고 세 번 요청하면, AI는 <b>세 번 다 다르게</b> 만듭니다. 왜 그런지, 어떻게 하면 한 방향으로 모을 수 있는지 확인합니다.";
	root.appendChild(lead);

	/* ---------- 1. 기준 정하기 ---------- */
	var h1=el("div","bh");
	h1.appendChild(el("span","tag","STEP A"));h1.appendChild(el("h3",null,"내 기준 정하기"));
	root.appendChild(h1);
	root.appendChild(el("p","lead","AI에게 넘길 기준입니다. 단어를 바꾸면 아래 검사 결과가 바로 달라집니다."));
	var noIn=document.createElement("input");
	noIn.className="txtin";noIn.value="최고, 대박, 인생, 놓치면 후회";
	var factIn=document.createElement("textarea");
	factIn.className="txtin";factIn.rows=3;factIn.style.resize="vertical";
	factIn.value="1994년에 문을 열었습니다\n점심에만 엽니다\n메뉴는 세 가지입니다";
	var b1=el("div");b1.appendChild(el("div","note","쓰지 않기로 한 단어 (쉼표로 구분)"));b1.appendChild(noIn);root.appendChild(b1);
	var b2=el("div");b2.style.marginTop="12px";
	b2.appendChild(el("div","note","확인된 사실 (줄바꿈으로 구분) — 여기에 없는 숫자와 연도가 나오면 지어낸 것입니다"));
	b2.appendChild(factIn);root.appendChild(b2);
	var opts=el("div","chips");opts.style.marginTop="12px";
	var flags={excl:true,num:true};
	[["excl","느낌표 쓰지 않기"],["num","확인 안 된 숫자 쓰지 않기"]].forEach(function(p){
		var b=el("button","chip",p[1]);b.setAttribute("aria-pressed","true");
		b.addEventListener("click",function(){
			flags[p[0]]=!flags[p[0]];b.setAttribute("aria-pressed",flags[p[0]]?"true":"false");
			runBatch();check();
		});
		opts.appendChild(b);
	});
	root.appendChild(opts);
	noIn.addEventListener("input",function(){runBatch();check();});
	factIn.addEventListener("input",function(){runBatch();check();});

	/* ---------- 검사기 ---------- */
	function factNums(){return factIn.value.match(/[0-9]+/g)||[];}
	function inspect(text){
		var hits=[];
		noIn.value.split(",").map(function(x){return x.trim();}).filter(Boolean).forEach(function(w){
			if(text.indexOf(w)>=0)hits.push({t:"쓰지 않기로 한 단어 ‘"+w+"’",w:w});
		});
		if(flags.excl&&text.indexOf("!")>=0)hits.push({t:"느낌표가 있습니다",w:"!"});
		if(flags.num){
			var ok=factNums();
			(text.match(/[0-9]+/g)||[]).forEach(function(nn){
				if(ok.indexOf(nn)<0)hits.push({t:"확인된 사실에 없는 숫자 ‘"+nn+"’",w:nn});
			});
		}
		return hits;
	}
	function mark(text,hits){
		var html=text.replace(/</g,"&lt;");
		hits.forEach(function(h){
			if(!h.w)return;
			html=html.split(h.w).join("<mark style='background:"+cv("--sig-soft")+";color:"+cv("--sig-ink")+";padding:0 3px;border-radius:4px'>"+h.w+"</mark>");
		});
		return html;
	}

	/* ---------- 2. 기준 없이 세 번 / 기준 붙여 세 번 ---------- */
	var h2=el("div","bh");h2.style.marginTop="22px";
	h2.appendChild(el("span","tag o","STEP B"));h2.appendChild(el("h3",null,"같은 요청을 세 번 해 보기"));
	root.appendChild(h2);
	var FREE=[
		"창원 최고의 국숫집! 20년 전통의 손맛, 하루 500그릇 판매!",
		"요즘 뜨는 그곳, 인생 국수를 만나다. 놓치면 후회하는 맛집",
		"1994년 개업, 3대째 내려오는 정통 국수 전문점입니다."
	];
	var BOUND=[
		"1994년에 문을 연 골목 안쪽 국숫집입니다. 점심에만 엽니다.",
		"골목 안쪽에 있는 오래된 국숫집입니다. 메뉴는 세 가지입니다.",
		"1994년부터 점심에만 문을 여는 국숫집입니다. 메뉴는 세 가지입니다."
	];
	var batchBox=el("div");root.appendChild(batchBox);
	var batchFb=el("div","fb");root.appendChild(batchFb);

	function runBatch(){
		batchBox.innerHTML="";
		var totals=[0,0];
		[["기준을 주지 않고 요청",FREE,0],["기준을 함께 주고 요청",BOUND,1]].forEach(function(grp){
			var wrap=el("div");wrap.style.marginTop="14px";
			var gh=el("div","note");
			wrap.appendChild(gh);
			grp[1].forEach(function(txt,i){
				var hits=inspect(txt);
				totals[grp[2]]+=hits.length;
				var card=el("div","taskcard");
				var t=el("div","tt");t.innerHTML="<span class='term'>"+(i+1)+"번째</span> "+mark(txt,hits);
				card.appendChild(t);
				var w=el("div","why show");
				w.innerHTML=hits.length
					? "<b>기준을 어긴 곳 "+hits.length+"군데</b> · "+hits.map(function(h){return h.t;}).join(" · ")
					: "<b>기준을 모두 지켰습니다.</b>";
				card.appendChild(w);
				card.style.borderColor=hits.length?cv("--sig"):cv("--ok");
				wrap.appendChild(card);
			});
			gh.innerHTML="<b>"+grp[0]+"</b> — 어긴 곳 모두 "+totals[grp[2]]+"군데";
			batchBox.appendChild(wrap);
		});
		batchFb.className="fb show "+(totals[0]>totals[1]?"ok":"no");
		batchFb.innerHTML=totals[0]>totals[1]
			? "<b>차이가 보입니다.</b> 기준 없이 요청한 세 개는 말투도 내용도 제각각이고, 확인되지 않은 숫자가 섞여 있습니다. 기준을 함께 준 세 개는 같은 방향으로 모입니다.<br><br>AI가 매번 다르게 만드는 것은 고장이 아닙니다. <b>확률로 고르기 때문에 원래 그렇습니다.</b> 그래서 한 방향으로 모으려면 <b>요청할 때마다 같은 기준을 함께 넘겨야</b> 합니다."
			: "<b>기준을 더 촘촘히 적어 보세요.</b> 지금 기준으로는 두 무리의 차이가 잘 드러나지 않습니다. 쓰지 않을 단어를 더 넣거나, 확인된 사실을 줄여 보세요.";
	}

	/* ---------- 3. 내 문구 검사 ---------- */
	var h3=el("div","bh");h3.style.marginTop="22px";
	h3.appendChild(el("span","tag c","STEP C"));h3.appendChild(el("h3",null,"내가 만든 문구 검사하기"));
	root.appendChild(h3);
	root.appendChild(el("p","lead","AI에게 받은 문구를 붙여넣으면 기준을 지켰는지 글자 단위로 확인합니다."));
	var ta=document.createElement("textarea");
	ta.className="txtin";ta.rows=3;ta.style.resize="vertical";
	ta.placeholder="AI가 만들어 준 문구를 여기에 붙여넣으세요.";
	ta.value="20년 전통! 창원 최고의 국숫집, 하루 500그릇 판매!";
	root.appendChild(ta);
	var brow=el("div","btnrow");
	var go=el("button","btn","기준 지켰는지 검사하기");
	brow.appendChild(go);root.appendChild(brow);
	var res=el("div");res.style.marginTop="14px";root.appendChild(res);
	function check(){
		var text=ta.value;
		res.innerHTML="";
		if(!text.trim()){res.appendChild(el("div","note","문구를 붙여넣어 주세요."));return;}
		var hits=inspect(text);
		var card=el("div","taskcard");
		var body=el("div","tt");body.innerHTML=mark(text,hits);
		card.appendChild(body);
		var w=el("div","why show");
		if(hits.length){
			w.innerHTML="<b>기준을 어긴 곳 "+hits.length+"군데</b><br>"+hits.map(function(h){return "· "+h.t;}).join("<br>")+
				"<br><br>조금 부풀려 말하는 것과 <b>없는 사실을 만드는 것</b>은 다릅니다. 숫자와 연도는 반드시 확인된 사실 안에 있어야 합니다.";
			card.style.borderColor=cv("--sig");
		}else{
			w.innerHTML="<b>기준을 모두 지켰습니다.</b> 쓰지 않기로 한 단어가 없고, 숫자도 확인된 사실 안에 있습니다.";
			card.style.borderColor=cv("--ok");
		}
		card.appendChild(w);res.appendChild(card);
	}
	go.addEventListener("click",check);
	runBatch();check();
};

STAGES.xai=function(root){
	var lead=el("p","lead");
	lead.innerHTML="은행이 대출 심사에 AI를 씁니다. 값을 바꿔 보면서 <b>어떤 항목이 결과를 밀었는지</b> 확인해 보세요.";

	var income=40,late=2,years=3;
	var cbox=el("div");root.appendChild(cbox);
	ctlRow(cbox,"연 소득",20,90,1,income,function(v){return v+"백만";},function(v){income=v;render();});
	ctlRow(cbox,"연체 횟수",0,6,1,late,function(v){return v+"회";},function(v){late=v;render();});
	ctlRow(cbox,"근무 기간",0,15,1,years,function(v){return v+"년";},function(v){years=v;render();});
	var verdict=el("div","keyline");root.appendChild(verdict);

	function render(){
		var c1=(income-40)*0.6, c2=-late*11, c3=years*2.2;

		var ok=total>=50;

			var w=el("div","bar"+(p[1]<0?" hit":""));

			var tr=el("div","tr");var f=el("div","fi");
			f.style.width=Math.min(100,Math.abs(p[1])*2.2)+"%";tr.appendChild(f);

			bars.appendChild(w);
		});
		var big=Math.abs(c2)>=Math.abs(c1)&&Math.abs(c2)>=Math.abs(c3)?"연체 횟수":Math.abs(c1)>=Math.abs(c3)?"연 소득":"근무 기간";
		expl.innerHTML="지금 결과를 가장 크게 민 항목은 <b>"+big+"</b>입니다. 이렇게 항목별로 얼마나 밀었는지 보여 주는 것이 설명가능한 AI(XAI)의 한 방법입니다. 거절을 받은 사람은 이 설명을 요구할 수 있어야 합니다.";
	}
	render();

	var s2=el("div");s2.style.marginTop="22px";root.appendChild(s2);
	s2.appendChild(el("p","lead","이번에는 생성형 AI의 답변입니다. 아래 세 문장에는 각각 출처가 붙어 있습니다. 하나씩 열어서 맞춰 보세요."));
	var SENT=[
		{t:"국내 대학 도서관은 대부분 학기 중 평일에 밤 10시까지 문을 엽니다.",src:"자료를 열어 보니 ‘대학마다 다르다’고만 적혀 있습니다.",r:"다름",why:"출처에는 그런 내용이 없습니다. 그럴듯하게 늘려 쓴 문장입니다."},
		{t:"창원대학교는 국립대학입니다.",src:"학교 공식 안내에 같은 내용이 있습니다.",r:"맞음",why:"출처와 문장이 일치합니다. 이 문장은 써도 됩니다."},
		{t:"2025년 기준 전국 대학 도서관 이용률은 78.4%입니다.",src:"링크를 여니 다른 주제의 보도자료입니다. 이 숫자는 없습니다.",r:"없음",why:"출처에 그 숫자가 아예 없습니다. 지어낸 숫자입니다."}
	];
	SENT.forEach(function(s){
		var card=el("div","taskcard");
		card.appendChild(el("div","tt",s.t));
		var row=el("div","picks");
		var b=el("button","pick","출처 열어 보기");
		var w=el("div","why");
		b.addEventListener("click",function(){
			if(card.locked)return;card.locked=true;
			b.classList.add(s.r==="맞음"?"right":"wrong");
			b.textContent="확인함 — "+s.r;
			w.innerHTML="<b>열어 보니</b> "+s.src+"<br><b>판정</b> "+s.why;
			w.classList.add("show");
		});
		row.appendChild(b);card.appendChild(row);card.appendChild(w);
		s2.appendChild(card);
	});
	var tip=el("div","fb show ok");
	tip.innerHTML="<b>정리</b> AI에게 ‘왜 그렇게 답했어?’라고 물어도, 그 대답 역시 새로 만든 문장입니다. 확인은 <b>출처를 직접 열어 맞춰 보는 것</b>뿐입니다.";
	s2.appendChild(tip);
};

	}
	draw();
};
