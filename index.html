<style>
:root{
	--bg:#f1f1f4; --surface:#ffffff; --surface-2:#e9e9ee; --surface-3:#dfdfe6;
	--ink:#101015; --ink-2:#43434e; --ink-3:#71717f; --line:#dcdce4;
	--acc:#16323a; --acc-soft:#e2e8ea; --acc-ink:#16323a;
	--sig:#c0436a; --sig-soft:#f7e2e9; --sig-ink:#a8355b;
	--ok:#1c7a72; --ok-soft:#dbeeec; --ok-ink:#166761;
	--warn:#8d6008; --warn-soft:#f6ead0;
	--sans:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;

	--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;

}
@media (prefers-color-scheme:dark){

		--bg:#0b0b0e; --surface:#15151b; --surface-2:#1e1e26; --surface-3:#282832;
		--ink:#eeeef4; --ink-2:#b2b2c0; --ink-3:#7c7c8c; --line:#282831;
		--acc:#e6edef; --acc-soft:#1e2a2e; --acc-ink:#cfe0e2;
		--sig:#ef8fa8; --sig-soft:#2c1720; --sig-ink:#f4a9bc;
		--ok:#55bdb4; --ok-soft:#12262a; --ok-ink:#74d0c6;
		--warn:#dda94a; --warn-soft:#2a2213;
		--e1:0 1px 2px rgba(0,0,0,.5);
		--e2:0 1px 2px rgba(0,0,0,.5),0 14px 30px -20px rgba(0,0,0,.85);
		--e3:0 2px 8px rgba(0,0,0,.55),0 34px 64px -32px rgba(0,0,0,.9);
	}
}
:root[data-theme="dark"]{
	--bg:#0b0b0e; --surface:#15151b; --surface-2:#1e1e26; --surface-3:#282832;

	--acc:#e6edef; --acc-soft:#1e2a2e; --acc-ink:#cfe0e2;
	--sig:#ef8fa8; --sig-soft:#2c1720; --sig-ink:#f4a9bc;

	--e1:0 1px 2px rgba(0,0,0,.5);
	--e2:0 1px 2px rgba(0,0,0,.5),0 14px 30px -20px rgba(0,0,0,.85);
	--e3:0 2px 8px rgba(0,0,0,.55),0 34px 64px -32px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.62;letter-spacing:-.02em;-webkit-font-smoothing:antialiased}
button{font-family:inherit;letter-spacing:-.02em}
:focus-visible{outline:2px solid var(--sig);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- app shell ---------- */
.app{display:flex;min-height:100vh}
.side{position:fixed;top:0;left:0;bottom:0;width:268px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;transition:transform .3s cubic-bezier(.32,.72,.16,1)}
.side-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:22px 20px 14px}
.side-title{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.14;letter-spacing:-.03em;margin-top:7px}
.side-x{display:none;border:none;background:none;color:var(--ink-3);font-size:17px;cursor:pointer;padding:2px 4px}
.side-search{padding:0 16px 10px}
.side-search .txtin{font-size:13px;padding:9px 12px;border-radius:8px}
.side-nav{flex:1;overflow-y:auto;padding:2px 12px 14px}
.nav-sec{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase;padding:18px 8px 7px;font-weight:600}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:none;color:var(--ink-2);font-family:var(--sans);font-size:13.5px;padding:9px 10px;border-radius:8px;cursor:pointer;letter-spacing:-.02em;line-height:1.34}
.nav-i:hover{background:var(--surface-2);color:var(--ink)}
.nav-i.on{background:var(--sig-soft);color:var(--sig-ink);font-weight:700}
.nav-i .nn{font-family:var(--mono);font-size:11px;color:var(--ink-3);min-width:17px;font-variant-numeric:tabular-nums;flex:none}
.nav-i.on .nn{color:var(--sig-ink)}
.nav-i.done .nn{color:var(--ok)}
.nav-i.dim{opacity:.4;cursor:default}
.nav-i.dim:hover{background:none;color:var(--ink-2)}
.nav-i .badge{margin-left:auto;font-family:var(--mono);font-size:9.5px;background:var(--sig);color:#fff;border-radius:99px;padding:2px 7px;flex:none}
.side-foot{border-top:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:12px}
.side-prog{flex:1;min-width:0}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
.main{flex:1;margin-left:268px;min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:13px 24px;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border-bottom:1px solid var(--line)}
.burger{display:none;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:14px;border-radius:8px;width:36px;height:36px;cursor:pointer}
.crumb{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
.topspacer{flex:1}
.view{max-width:760px;margin:0 auto;padding:34px 24px 96px}
.home{padding:0}
.empty{padding:26px 0;color:var(--ink-3);font-size:14.5px}
.ncard{border:1px solid var(--line);border-radius:var(--r-xl);padding:20px 22px;background:var(--surface);margin-bottom:12px}
.ncard .nd{font-family:var(--mono);font-size:11px;color:var(--sig-ink);letter-spacing:.08em;font-weight:600}
.ncard h4{font-family:var(--serif);font-size:19px;font-weight:700;margin:7px 0 8px;letter-spacing:-.03em}
.ncard p{margin:0;font-size:14.5px;color:var(--ink-2);line-height:1.66}
.ncard a{display:inline-block;margin-top:12px;font-size:13.5px;font-weight:700;color:var(--sig-ink);text-decoration:none;border-bottom:1px solid var(--sig)}
.mgroup{margin-bottom:26px}
.mgroup h4{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase;margin:0 0 10px;font-weight:600}
.mitem{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 18px;background:var(--surface);margin-bottom:9px;text-decoration:none;color:var(--ink);font-size:15px;font-weight:500;transition:border-color .15s,transform .16s}
.mitem:hover{border-color:var(--sig);transform:translateX(3px)}
.mitem .arw{margin-left:auto;color:var(--ink-3);font-family:var(--mono);font-size:13px}
.mitem.nolink{opacity:.7;pointer-events:none}
@media (max-width:900px){
	.side{transform:translateX(-100%);box-shadow:var(--e3)}
	.app.nav-open .side{transform:none}
	.app.nav-open .scrim{display:block}
	.side-x{display:block}
	.main{margin-left:0}
	.burger{display:block}
	.view{padding:26px 20px 90px}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

/* ---------- hero ---------- */
.mast{padding:26px 0 34px;border-bottom:1px solid var(--line)}
.mast-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:44px}
.code{font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;color:var(--ink-3);font-weight:600;text-transform:uppercase}
.theme-btn{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink-2);font-family:var(--mono);font-size:11px;letter-spacing:.1em;border-radius:99px;padding:7px 15px;cursor:pointer;text-transform:uppercase}
.theme-btn:hover{border-color:var(--sig);color:var(--sig-ink)}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(42px,9vw,74px);line-height:.98;margin:0 0 .28em;letter-spacing:-.035em;text-wrap:balance}

.mast-meta{margin-top:26px;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase}

/* ---------- progress ---------- */
.summary{display:grid;grid-template-columns:1fr auto auto;gap:18px 20px;align-items:center;margin:26px 0 0;padding:22px 0 24px;border-bottom:1px solid var(--line)}
@media (max-width:600px){.summary{grid-template-columns:1fr auto}.summary .go{grid-column:1/-1}}
.summary .lab{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--sig-ink);font-weight:600;text-transform:uppercase}
.summary .nextline{font-family:var(--serif);font-size:23px;font-weight:700;margin-top:5px;letter-spacing:-.02em;text-wrap:balance}
.sum-num{font-family:var(--mono);font-size:40px;font-weight:600;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.sum-num i{font-style:normal;font-size:17px;color:var(--ink-3);letter-spacing:-.02em}
.summary .go{border:none;background:var(--acc);color:var(--bg);font-size:14.5px;font-weight:700;border-radius:var(--r);padding:13px 26px;cursor:pointer;white-space:nowrap;transition:transform .16s,opacity .16s}
.summary .go:hover{transform:translateY(-1px);opacity:.88}
.pbar{grid-column:1/-1;display:flex;align-items:center;gap:14px}
.ptrack{flex:1;height:3px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.pfill{height:100%;width:0;background:var(--sig);border-radius:99px;transition:width .55s cubic-bezier(.32,.72,.16,1)}
.ptxt{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.02em}

/* ---------- week list ---------- */
.blockhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:44px 0 14px}
.blockhead h2{font-family:var(--serif);font-size:21px;font-weight:700;margin:0;letter-spacing:-.025em}
.blockhead .rng{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
.weeks{display:grid;gap:10px}
.wk{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:18px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:18px 22px;cursor:pointer;font-family:var(--sans);color:var(--ink);transition:border-color .16s,transform .18s cubic-bezier(.32,.72,.16,1),background .16s}
.wk:hover{border-color:var(--sig);transform:translateY(-2px)}
.wk .no{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--ink-3);letter-spacing:-.04em;font-variant-numeric:tabular-nums;transition:color .16s}
.wk:hover .no{color:var(--sig)}
.wk.done .no{color:var(--ok)}
.wk .t{font-size:16.5px;font-weight:700;display:block;letter-spacing:-.025em}
.wk .s{font-size:13px;color:var(--ink-3);display:block;margin-top:2px;letter-spacing:-.015em}
.wk .st{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap;letter-spacing:.1em;text-transform:uppercase}
.wk.done .st{color:var(--ok-ink);font-weight:600}
.wk.now{border-color:var(--sig);background:var(--surface)}
.wk.now .no{color:var(--sig)}
.wk.now .st{color:var(--sig-ink);font-weight:600}
.wk.exam{cursor:default;background:transparent;border-style:dashed;opacity:.62}
.wk.exam:hover{border-color:var(--line);transform:none}
.homefoot{margin-top:46px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-3)}
.linkbtn{border:1px solid var(--line);background:transparent;color:var(--ink-2);font-size:12px;border-radius:99px;padding:8px 15px;cursor:pointer}
.linkbtn:hover{border-color:var(--sig);color:var(--sig-ink)}

/* ---------- lesson ---------- */
.lbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border-bottom:1px solid var(--line)}
.lbar-in{max-width:740px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.back{border:none;background:none;color:var(--ink);font-size:14.5px;font-weight:700;cursor:pointer;padding:0;letter-spacing:-.02em}
.back:hover{color:var(--sig-ink)}
.lbar .wknum{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.12em}
.lbody{max-width:740px;margin:0 auto;padding:30px 22px 80px}
.lhead .wkbig{font-family:var(--mono);font-size:clamp(56px,15vw,88px);font-weight:400;line-height:.85;letter-spacing:-.06em;color:var(--sig);opacity:.28;margin-bottom:6px}
.lhead .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--sig-ink);font-weight:600;text-transform:uppercase}

.lhead p{margin:0;color:var(--ink-2);font-size:15.5px}
.goal{margin:22px 0 0;padding:18px 20px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--sig);font-size:15px}
.goal b{color:var(--sig-ink)}

.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);margin-top:18px;overflow:hidden}
.block-in{padding:22px}
.bh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bh .tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;font-weight:600;padding:4px 9px;border-radius:6px;background:var(--surface-2);color:var(--ink-3);text-transform:uppercase}

.q{font-size:16.5px;font-weight:700;margin:0 0 13px;line-height:1.5;letter-spacing:-.025em}
.opts{display:grid;gap:9px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;border-radius:var(--r);padding:13px 16px;cursor:pointer;transition:border-color .14s,background .14s,transform .16s}

 ok:"맞습니다. AI는 문제의 성격에 따라 규칙, 학습, 생성, 도구 사용 등을 서로 다른 수준에서 활용할 수 있습니다.",no:"답은 ②번입니다. AI는 규칙이나 데이터에서 학습한 패턴 등을 이용해 지능적인 행동을 만들 수 있습니다."}},{n:2,block:"기초·원리",title:"규칙기반에서 학습기반으로",sub:"스팸 문자 걸러내기",stage:"rulebot",
 goal:"광고 문자를 걸러 내는 규칙을 직접 만들어 봅니다. 그리고 규칙만으로 처리하기 어려운 지점을 찾아봅니다.",
 predict:{q:"막을 단어를 100개, 1000개로 계속 늘리면 광고 문자를 다 막을 수 있을까요?",opts:["할 수 있습니다. 광고에 쓰는 말은 정해져 있습니다.","어렵습니다. 정상 문자까지 막히기 시작합니다."],a:1,
 ok:"맞습니다. ‘무료’를 막으면 ‘무료 배송 안내’도 막힙니다. 광고는 단어를 띄어 써서 규칙을 피해 갑니다.",
 no:"답은 ②번입니다. ‘무료’를 막으면 ‘무료 배송 안내’ 같은 정상 문자도 막힙니다. 광고 쪽은 단어를 띄어 써서 규칙을 피해 갑니다."},
 observe:["규칙기반(rule-based)은 두 가지로 실패합니다. 광고를 놓치는 <b>거짓 음성</b>과 정상 문자를 막는 <b>거짓 양성</b>입니다.","단어 사이에 띄어쓰기를 넣으면(예: 대 출) 규칙을 피할 수 있습니다. 사람은 같은 의미로 알아보지만 단순한 규칙은 놓칠 수 있습니다.","학습기반 모델은 사람이 모든 규칙을 일일이 적는 대신, <b>예시와 정답(라벨)</b>을 바탕으로 패턴을 학습합니다. 이 실습에서는 각 문자가 광고인지 정상인지 표시해 봅니다.","규칙기반에서는 ‘이 단어 때문’처럼 사람이 정한 규칙을 직접 가리킬 수 있습니다. 반면 학습 모델의 판단은 여러 입력의 결합으로 이루어질 수 있어 <b>단순한 한 줄의 규칙으로 설명하기 어려울 수 있습니다</b>.","모델이 이유를 숨기는 것이 아닙니다. 판단에 영향을 주는 정보가 <b>여러 단어에 조금씩 나뉘어</b> 있을 수 있는 것입니다."],
 key:"규칙기반은 <b>사람이 규칙을 명시합니다</b>. 학습기반은 <b>예시와 정답을 바탕으로 모델이 패턴을 학습합니다</b>. 모델이 복잡해질수록 판단 근거를 단순한 규칙 한 줄로 설명하기 어려울 수 있습니다.",
 check:{q:"학습기반 모델의 판단을 사람이 정한 규칙 한 줄로 설명하기 어려운 까닭은 무엇일까요?",opts:["모델이 이유를 숨기기 때문입니다","이유가 단어 하나가 아니라 여러 단어에 조금씩 흩어져 있기 때문입니다","모델이 계산하지 않기 때문입니다","단어 점수가 없기 때문입니다"],a:1,
 ok:"맞습니다. 실습에서 단어를 하나씩 빼도 판단이 쉽게 바뀌지 않았습니다. 이런 판단 근거를 어떻게 확인하고 설명할지 12주차의 설명가능한 AI(XAI)에서 다룹니다.",no:"답은 ②번입니다. 단어 하나를 빼도 판단이 쉽게 바뀌지 않았던 점을 떠올려 보세요. 판단에 영향을 주는 정보가 한 곳에만 있는 것은 아닙니다."}},

{n:3,block:"기초·원리",title:"머신러닝",sub:"Teachable Machine으로 직접 학습시키기 · 데이터와 일반화",stage:"teachable",
 goal:"정답이 붙은 예시를 직접 모아 모델을 학습시킵니다. 그리고 새로운 사진에서도 잘 분류하는지 확인하면서 데이터의 양·다양성·균형이 왜 중요한지 알아봅니다.",
 predict:{q:"두 종류의 물건을 각각 여러 장씩 보여 주고 모델을 학습시켰습니다. 새로운 사진에서도 잘 분류하게 하려면 무엇이 가장 중요할까요?",opts:["학습 사진을 많이 모으되 같은 구도와 배경만 반복합니다","각 종류를 여러 각도·거리·배경에서 골고루 보여 주고, 학습에 사용하지 않은 새로운 사진으로 테스트합니다","한 종류의 사진만 많이 넣습니다","학습이 끝난 뒤 같은 사진으로 다시 확인합니다"],a:1,
 ok:"맞습니다. 학습 데이터가 다양한 상황을 충분히 대표하고, 학습에 사용하지 않은 새로운 예시로 테스트해야 새로운 입력에도 잘 작동하는지 확인할 수 있습니다.",
 no:"답은 ②번입니다. 같은 사진을 반복해서 보여 주기보다 다양한 조건의 예시를 제공하고, 학습에 사용하지 않은 새로운 예시로 테스트하는 것이 중요합니다."},
 observe:["Teachable Machine에서는 먼저 <b>클래스(분류할 종류)</b>를 만들고 각 클래스에 예시를 모은 뒤 <b>Train Model</b>로 모델을 학습시킵니다.","학습이 끝났다고 해서 새로운 사진에서도 항상 잘 분류하는 것은 아닙니다. <b>학습에 사용하지 않은 새로운 예시</b>로 테스트해야 합니다.","한 종류에만 사진이 몰리거나 배경·각도·거리 등이 지나치게 비슷하면, 모델이 우리가 의도한 특징보다 <b>우연한 단서</b>를 이용할 수 있습니다.","사진을 더 다양한 조건에서 다시 모아 학습하고 테스트한 뒤 결과가 달라지는지 비교해 보세요. 이것이 <b>일반화</b>와 데이터 품질을 이해하는 출발점입니다."],
 key:"머신러닝은 <b>예시 데이터에서 패턴을 학습</b>합니다. 좋은 결과를 얻으려면 데이터가 목표로 하는 상황을 잘 대표해야 하고, <b>학습에 사용하지 않은 새로운 데이터</b>로 성능을 확인해야 합니다.",
 check:{q:"Teachable Machine으로 물건 A와 B를 분류하는 모델을 만들었습니다. 모델이 실제 상황에서도 잘 작동하는지 확인하려면 무엇을 해야 할까요?",opts:["학습에 사용했던 사진을 다시 넣어 확인합니다","A와 B의 학습 사진 수만 계속 늘립니다","학습에 사용하지 않은 새로운 사진을 여러 조건에서 넣어 결과를 확인합니다","모델의 이름을 바꿉니다"],a:2,
 ok:"맞습니다. 새로운 데이터로 테스트해야 모델이 학습한 예시를 단순히 외운 것이 아니라 새로운 입력에도 잘 일반화하는지 확인할 수 있습니다.",no:"답은 ③번입니다. 학습에 사용하지 않은 새로운 사진으로 테스트해야 일반화 여부를 확인할 수 있습니다."}},

{n:4,block:"기초·원리",title:"신경망과 딥러닝",sub:"가중치와 임계값을 스스로 찾아가는 과정",stage:"neural",
 goal:"인공 뉴런의 가중치와 임계값을 직접 조정해 봅니다. 그다음 같은 일을 모델이 스스로 학습하게 해서 비교합니다.",
 predict:{q:"모델이 ‘학습한다’는 말을 계산 관점에서 보면 무엇에 가까울까요?",opts:["정답을 통째로 외웁니다","오차를 줄이는 쪽으로 가중치를 조금씩 조정합니다","규칙을 하나씩 더합니다","데이터를 작게 줄여 저장합니다"],a:1,
 ok:"맞습니다. 학습은 오차를 줄이는 방향으로 가중치를 반복해서 조정하는 과정입니다. 경사하강법(gradient descent)은 이러한 가중치 업데이트에 널리 사용되는 방법입니다.",
 no:"답은 ②번입니다. 학습은 오차를 줄이는 방향으로 가중치를 조정하는 과정이며, 경사하강법은 그 업데이트에 널리 사용됩니다."},
 observe:["가중치를 바꾸면 <b>모델의 판단이 달라질 수 있음</b>을 확인했습니다.","학습은 모델이 한 번에 완벽한 답을 내는 것이 아니라, <b>틀린 정도를 확인하고 조금씩 조정하는 과정</b>입니다.","이 과정을 여러 번 반복하면 모델의 판단이 정답에 가까워질 수 있습니다."],
 key:"딥러닝은 이런 계산을 <b>여러 층으로 구성한 신경망</b>에 적용해 학습시키는 방법입니다. 더 복잡한 패턴을 표현할 수 있지만, 모델의 판단 과정을 사람이 직접 따라가기는 어려워질 수 있습니다.",
 check:{q:"층을 깊게 쌓을수록 함께 커질 수 있는 문제는 무엇일까요?",opts:["학습 데이터가 필요 없어집니다","판단의 근거를 따라가기 어려워집니다","계산이 단순해집니다","틀린 정도가 저절로 0이 됩니다"],a:1,
 ok:"맞습니다. 12주 설명가능한 AI(XAI)로 이어지는 문제입니다.",no:"답은 ②번입니다. 모델이 어떤 정보를 바탕으로 판단했는지 사람이 직접 따라가기 어려워질 수 있습니다. 12주차에서 다룹니다."}},

{n:5,block:"기초·원리",title:"특징과 표현",sub:"사진 속 단서를 찾아보기 · 특징(feature)과 표현",stage:"features",
 goal:"분류에 도움이 되는 정보가 무엇인지 선택해 보면서, 특징(feature)과 표현이 왜 필요한지 직관적으로 이해합니다.",
 predict:{q:"컵을 사진으로 분류한다고 할 때, 여러 사진에서 ‘컵’이라는 공통점을 찾는 데 더 도움이 되는 것은 무엇일까요?",opts:["사진 파일의 이름","모든 픽셀을 아무 구분 없이 똑같이 보기","모양·윤곽·질감처럼 분류에 도움이 되는 반복적인 특징","사진을 찍은 사람의 이름"],a:2,
 ok:"맞습니다. 분류에 도움이 되는 반복적인 단서, 즉 특징(feature)을 표현하는 것이 중요합니다.",
 no:"답은 ③번입니다. 사진마다 픽셀은 달라도 모양·윤곽·질감처럼 반복되는 특징은 분류에 도움이 될 수 있습니다."},
 observe:["같은 물건도 <b>각도·거리·밝기·배경</b>이 달라지면 픽셀은 크게 달라집니다.","특징(feature)은 입력에서 <b>분류나 예측에 도움이 되는 정보</b>를 나타내는 방식입니다.","전통적인 머신러닝에서는 사람이 특징을 설계하기도 했지만, 딥러닝에서는 신경망이 데이터에서 유용한 표현을 <b>학습</b>할 수 있습니다.","오늘은 CNN 수식을 계산하지 않고, <b>어떤 시각적 단서가 분류에 유용한지</b> 직접 비교해 봅니다."],
 key:"딥러닝은 입력에서 예측에 유용한 <b>특징과 표현</b>을 여러 단계에 걸쳐 학습할 수 있습니다.",
 check:{q:"딥러닝에서 ‘특징을 학습한다’는 말은 무엇을 뜻할까요?",opts:["사람이 모든 규칙을 미리 입력한다는 뜻입니다","모델이 입력에서 예측에 도움이 되는 패턴이나 표현을 학습한다는 뜻입니다","사진 파일 이름을 외운다는 뜻입니다","모든 사진을 똑같이 처리한다는 뜻입니다"],a:1,
 ok:"맞습니다. 딥러닝에서는 사람이 모든 특징을 일일이 지정하지 않아도 데이터에서 유용한 표현을 학습할 수 있습니다.",no:"답은 ②번입니다. 데이터에서 예측에 유용한 패턴이나 표현을 학습하는 것이 핵심입니다."}},

{n:6,block:"기초·원리",title:"생성형 AI",sub:"다음 단어 예측 · 생성 · 한계",stage:"genlm",
 goal:"글에서 단어 빈도표를 직접 만들어 문장을 생성합니다. 그리고 그 문장이 원문에 있는지 대조해 봅니다.",
 predict:{q:"AI가 사실이 아닌 내용을 자신 있게 말하는 이유는 무엇일까요?",opts:["배운 자료에 거짓말이 많아서","가장 그럴듯한 다음 단어를 고르는 방식이라, 사실을 확인하는 단계가 없어서","사람을 속이도록 만들어져서","질문이 어려워서"],a:1,
 ok:"맞습니다. 문장을 이어 붙이는 구조 안에 사실 확인 단계가 없습니다.",
 no:"답은 ②번입니다. 문장을 이어 붙이는 구조 안에 사실을 확인하는 단계가 아예 없습니다."},
 observe:["생성형 언어 모델은 앞의 맥락을 바탕으로 <b>다음 토큰이 나올 확률 분포</b>를 계산하고, 그 분포에 따라 토큰을 선택해 문장을 이어 갑니다.","온도(temperature) 값이 낮으면 선택의 다양성이 줄어들고, 높으면 다양한 토큰이 선택될 가능성이 커집니다.","모델이 생성한 문장은 학습 자료의 문장을 그대로 복사하는 것과는 다릅니다. 학습한 패턴을 바탕으로 <b>새로운 토큰 시퀀스</b>를 생성할 수 있습니다.","읽으면 자연스러운데 사실은 틀린 문장이 이렇게 만들어집니다. 특히 <b>구체적인 이름·숫자·연도·출처</b>처럼 검증 가능한 사실은 반드시 따로 확인하는 습관이 중요합니다."],
 key:"생성형 AI는 <b>언어 패턴을 바탕으로 결과를 생성하는 모델</b>이지, 생성 과정 자체가 사실 여부를 보장하는 데이터베이스는 아닙니다. 따라서 중요한 사실·숫자·출처는 별도로 확인해야 합니다.",
 check:{q:"보고서에 넣을 숫자를 AI가 알려 줬습니다. 다음에 무엇을 해야 할까요?",opts:["출처를 물어보고, 원래 자료를 직접 열어 맞춰 봅니다","한 번 더 물어서 같은 답이 나오면 믿습니다","다른 AI에도 물어 같으면 믿습니다","표현만 바꿔서 씁니다"],a:0,
 ok:"맞습니다. 같은 답이 여러 번 나오는 것은 근거가 아닙니다.",no:"답은 ①번입니다. 같은 답이 여러 번 나오는 것은 근거가 되지 않습니다."}},

{n:7,block:"중간 점검",title:"중간 정리와 사전 진단",sub:"1~6주 종합 · 요청문 비교",stage:"midreview",
 goal:"1~6주 내용을 문제로 점검합니다. 그리고 같은 과제를 어떻게 요청하면 결과가 달라지는지 봅니다.",

function hashOf(){var h=location.hash||"";return h.charAt(0)==="#"?h.substring(1):h;}
var lastRoute=null;
function render(h){
	h=h||"/";
	if(h.indexOf("/week/")===0){
		var n=parseInt(h.substring(6),10);
		if(wk(n)&&!wk(n).exam)renderWeek(n);else renderHome();
	}
	else if(h.indexOf("/notices")===0)renderNotices();
	else if(h.indexOf("/materials")===0)renderMaterials();
	else if(h.indexOf("/notes")===0)renderNotes();
	else renderHome();

	setNav(false);

	renderNav();
}
function go(h){

function navItem(opt){

function renderNav(){

		sideNav.appendChild(navItem({label:"자료",on:here.t==="materials",act:function(){go("/materials");}}));
		sideNav.appendChild(navItem({label:"노트 인쇄",on:here.t==="notes",act:function(){go("/notes");}}));
	}
	BLOCKS.forEach(function(b){
		var rows=WEEKS.filter(function(w){
			if(w.block!==b.name)return false;
			if(!q)return true;
			return (w.title+" "+w.sub+" "+(w.goal||"")).indexOf(q)>=0;
		});

function block(tag,label,title){
	var b=el("section","block"),inn=el("div","block-in");b.appendChild(inn);
	var h=el("div","bh");h.appendChild(el("span","tag "+tag,label));h.appendChild(el("h3",null,title));inn.appendChild(h);
	b.inner=inn;return b;
}
function quizBlock(spec,tag,label,title,onRight){
	var b=block(tag,label,title),inn=b.inner;
	inn.appendChild(el("p","q",spec.q));
	var wrap=el("div","opts");inn.appendChild(wrap);
	var fb=el("div","fb");inn.appendChild(fb);
	var tries=0,settled=false;
	spec.opts.forEach(function(o,i){
		var btn=el("button","opt",o);
		btn.addEventListener("click",function(){
			if(settled)return;
			var right=(i===spec.a);
			var all=wrap.querySelectorAll(".opt");
			if(right){
				settled=true;
				for(var k=0;k<all.length;k++)all[k].disabled=true;
				btn.classList.add("pick-ok");
				fb.className="fb show ok";
				fb.innerHTML="<b>"+(tries?"두 번째에 맞혔습니다":"정답입니다")+"</b> "+spec.ok;
				if(onRight)onRight(true);
				return;
			}
			tries++;
			btn.classList.add("pick-no");
			btn.disabled=true;
			if(tries===1){
				fb.className="fb show no";
				fb.innerHTML="<b>다시 한 번</b> 아직 정답이 아닙니다. 오늘 배운 내용을 떠올리며 한 번 더 골라 보세요.";
			}else{
				settled=true;
				for(var k2=0;k2<all.length;k2++)all[k2].disabled=true;
				all[spec.a].classList.add("pick-ok");
				fb.className="fb show no";
				fb.innerHTML="<b>정답을 확인해 보세요</b> "+spec.no;
				if(onRight)onRight(false);
			}
		});
		wrap.appendChild(btn);
	});
	return b;
}
function ctlRow(parent,label,min,max,step,val,fmt,onIn){
	var row=el("div","ctl");
	var id="c"+Math.floor(val*1e6)+label.length+parent.children.length;
	var lab=el("label",null,label);lab.setAttribute("for",id);
	var inp=document.createElement("input");inp.type="range";inp.id=id;inp.min=min;inp.max=max;inp.step=step;inp.value=val;
	var out=el("output",null,fmt(val));
	inp.addEventListener("input",function(){out.textContent=fmt(+inp.value);onIn(+inp.value);});
	row.appendChild(lab);row.appendChild(inp);row.appendChild(out);parent.appendChild(row);
	return inp;
}
function metric(k,v,cls){var m=el("div","metric"+(cls?" "+cls:""));m.appendChild(el("div","k",k));var vv=el("div","v",v);m.appendChild(vv);m.val=vv;return m;}
function pixgrid(size,cell,ro){
	var g=el("div","pix"+(ro?" ro":""));g.style.gridTemplateColumns="repeat("+size+","+cell+"px)";
	g.cells=[];
	for(var i=0;i<size*size;i++){var c=el("div","px");c.style.width=cell+"px";c.style.height=cell+"px";g.appendChild(c);g.cells.push(c);}
	return g;
}
function paintable(g,size,onChange){
	var down=false;
	function set(t,on){var i=g.cells.indexOf(t);if(i<0)return;g.cells[i].classList.toggle("on",on);onChange();}
	g.addEventListener("pointerdown",function(e){down=true;g.setPointerCapture(e.pointerId);var t=e.target;set(t,!t.classList.contains("on"));});
	g.addEventListener("pointermove",function(e){if(!down)return;var t=document.elementFromPoint(e.clientX,e.clientY);if(t&&t.classList.contains("px"))set(t,true);});
	window.addEventListener("pointerup",function(){down=false;});
}
function gridVals(g){return g.cells.map(function(c){return c.classList.contains("on")?1:0;});}
function setGrid(g,arr){g.cells.forEach(function(c,i){c.classList.toggle("on",!!arr[i]);});}

STAGES.taskmap=function(root){
	var lead=el("p","lead");
	lead.innerHTML="아래는 회사에서 흔히 하는 일입니다. 각각을 <b>누가 하면 좋을지</b> 골라 보세요. 다 고른 뒤 채점 단추를 누르세요.";
	root.appendChild(lead);
	var LBL=["AI가 한다","사람이 한다","같이 한다"];
	var TASKS=[
		{t:"고객 후기 5,000건을 좋음과 나쁨으로 나누기",a:0,why:"같은 일이 아주 많이 반복됩니다. 사례도 많이 쌓여 있습니다. AI가 가장 잘하는 종류입니다."},
		{t:"이번 분기 광고비를 얼마로 할지 정하기",a:1,why:"돈을 쓰는 결정입니다. 결과에 책임이 따르므로 사람이 정해야 합니다."},
		{t:"영어 시장 보고서 30쪽을 한국어로 요약하기",a:0,why:"글을 읽고 줄이는 일입니다. AI가 빠르고 정확한 편입니다. 다만 숫자는 확인해야 합니다."},
		{t:"회사 소개 글 초안을 쓰고 사실을 확인하기",a:2,why:"초안은 AI가 빨리 씁니다. 사실이 맞는지 확인하는 일은 사람이 해야 합니다."},
		{t:"지원자 중에서 최종 합격자 정하기",a:1,why:"한 사람의 삶에 영향을 주는 결정입니다. 사람이 판단하고 책임져야 합니다."},
		{t:"가게 소개 문구 3개를 만들고 그중 하나 고르기",a:2,why:"여러 개를 만드는 일은 AI가 잘합니다. 어느 것이 우리와 맞는지는 사람이 고릅니다."}
	];
	var picks=[];
	TASKS.forEach(function(task,i){
		var card=el("div","taskcard");
		card.appendChild(el("div","tt",(i+1)+". "+task.t));
		var row=el("div","picks");
		LBL.forEach(function(l,j){
			var b=el("button","pick",l);
			b.addEventListener("click",function(){
				if(card.locked)return;
				picks[i]=j;
				var bs=row.querySelectorAll(".pick");
				for(var k=0;k<bs.length;k++)bs[k].classList.remove("sel");
				b.classList.add("sel");
			});
			row.appendChild(b);
		});
		card.appendChild(row);
		var why=el("div","why",task.why);
		card.appendChild(why);
		card.row=row;card.why=why;task.card=card;
		root.appendChild(card);
	});
	var res=el("div","fb");root.appendChild(res);
	var br=el("div","btnrow");
	var go=el("button","btn","채점하기");
	var again=el("button","btn gray","다시 풀기");
	br.appendChild(go);br.appendChild(again);root.appendChild(br);
	var graded=0;
	go.addEventListener("click",function(){
		for(var i=0;i<TASKS.length;i++){if(picks[i]==null){toast((i+1)+"번을 아직 안 골랐습니다");return;}}
		graded++;
		var n=0;
		TASKS.forEach(function(task,i){
			var bs=task.card.row.querySelectorAll(".pick");
			var ok=(picks[i]===task.a);
			if(ok)n++;
			if(graded===1&&n>=0&&!allRight()){
				for(var k=0;k<bs.length;k++){bs[k].classList.remove("wrong");bs[k].classList.remove("right");}
				if(!ok)bs[picks[i]].classList.add("wrong");
				task.card.style.borderColor=ok?cv("--ok"):cv("--sig");
			}else{
				for(var k2=0;k2<bs.length;k2++)bs[k2].classList.remove("sel");
				bs[task.a].classList.add("right");
				if(!ok)bs[picks[i]].classList.add("wrong");
				task.card.why.classList.add("show");
				task.card.locked=true;
			}
		});
		if(graded===1&&n<TASKS.length){
			res.className="fb show no";
			res.innerHTML="<b>"+n+" / 6</b> 빨갛게 표시된 것이 틀린 답입니다. 정답은 아직 보여 드리지 않았습니다. 다시 골라 보고 채점을 한 번 더 누르세요.";
			go.textContent="다시 채점하기";
		}else{
			res.className="fb show "+(n>=5?"ok":"no");
			res.innerHTML="<b>"+n+" / 6 정답</b> 정답을 보면 규칙이 하나 보입니다. <b>반복이 많은 일</b>은 AI가, <b>책임이 따르는 결정</b>은 사람이 합니다. 그 사이에 있는 일은 같이 합니다.";
			go.disabled=true;
		}
	});
	function allRight(){
		for(var i=0;i<TASKS.length;i++)if(picks[i]!==TASKS[i].a)return false;
		return true;
	}
	again.addEventListener("click",function(){
		picks=[];res.className="fb";graded=0;go.disabled=false;go.textContent="채점하기";
		TASKS.forEach(function(task){
			var bs=task.card.row.querySelectorAll(".pick");
			for(var k=0;k<bs.length;k++)bs[k].className="pick";
			task.card.style.borderColor="";
			task.card.why.classList.remove("show");task.card.locked=false;
		});
	});
};

		else prev.innerHTML=head+"“"+(def||"우리 가게")+"입니다. "+facts.slice(0,2).join(". ")+".”<br><span class='term'>좋습니다</span> 사실만 담겼고 톤도 지켰습니다. 네 칸과 맥락을 모두 채웠기 때문입니다.";
	}
	render();

			return;
		}
		res.className="fb show ok";
		res.innerHTML="<b>잘 이었습니다</b> 도구를 많이 쓴 것이 아니라 <b>순서와 확인 지점</b>을 정한 것이 핵심입니다. 확인 단계가 있어야 앞의 잘못이 뒤로 넘어가지 않습니다.";

STAGES.brandcheck=function(root){
	var lead=el("p","lead");
	lead.innerHTML="같은 요청을 여러 번 해도 생성 결과가 <b>달라질 수 있습니다</b>. 왜 그런지, 그리고 기준을 어떻게 주어 결과를 관리할 수 있는지 확인합니다.";
	root.appendChild(lead);

	/* ---------- 1. 기준 정하기 ---------- */
	var h1=el("div","bh");
	h1.appendChild(el("span","tag","STEP A"));h1.appendChild(el("h3",null,"내 기준 정하기"));
	root.appendChild(h1);
	root.appendChild(el("p","lead","AI에게 넘길 기준입니다. 단어를 바꾸면 아래 검사 결과가 바로 달라집니다."));
	var noIn=document.createElement("input");
	noIn.className="txtin";noIn.value="최고, 대박, 인생, 놓치면 후회";
	var factIn=document.createElement("textarea");
	factIn.className="txtin";factIn.rows=3;factIn.style.resize="vertical";
	factIn.value="1994년에 문을 열었습니다\n점심에만 엽니다\n메뉴는 세 가지입니다";
	var b1=el("div");b1.appendChild(el("div","note","쓰지 않기로 한 단어 (쉼표로 구분)"));b1.appendChild(noIn);root.appendChild(b1);
	var b2=el("div");b2.style.marginTop="12px";
	b2.appendChild(el("div","note","확인된 사실 (줄바꿈으로 구분) — 여기에 없는 숫자와 연도가 나오면 지어낸 것입니다"));
	b2.appendChild(factIn);root.appendChild(b2);
	var opts=el("div","chips");opts.style.marginTop="12px";
	var flags={excl:true,num:true};
	[["excl","느낌표 쓰지 않기"],["num","확인 안 된 숫자 쓰지 않기"]].forEach(function(p){
		var b=el("button","chip",p[1]);b.setAttribute("aria-pressed","true");
		b.addEventListener("click",function(){
			flags[p[0]]=!flags[p[0]];b.setAttribute("aria-pressed",flags[p[0]]?"true":"false");
			runBatch();check();
		});
		opts.appendChild(b);
	});
	root.appendChild(opts);
	noIn.addEventListener("input",function(){runBatch();check();});
	factIn.addEventListener("input",function(){runBatch();check();});

	/* ---------- 검사기 ---------- */
	function factNums(){return factIn.value.match(/[0-9]+/g)||[];}
	function inspect(text){
		var hits=[];
		noIn.value.split(",").map(function(x){return x.trim();}).filter(Boolean).forEach(function(w){
			if(text.indexOf(w)>=0)hits.push({t:"쓰지 않기로 한 단어 ‘"+w+"’",w:w});
		});
		if(flags.excl&&text.indexOf("!")>=0)hits.push({t:"느낌표가 있습니다",w:"!"});
		if(flags.num){
			var ok=factNums();
			(text.match(/[0-9]+/g)||[]).forEach(function(nn){
				if(ok.indexOf(nn)<0)hits.push({t:"확인된 사실에 없는 숫자 ‘"+nn+"’",w:nn});
			});
		}
		return hits;
	}
	function mark(text,hits){
		var html=text.replace(/</g,"&lt;");
		hits.forEach(function(h){
			if(!h.w)return;
			html=html.split(h.w).join("<mark style='background:"+cv("--sig-soft")+";color:"+cv("--sig-ink")+";padding:0 3px;border-radius:4px'>"+h.w+"</mark>");
		});
		return html;
	}

	/* ---------- 2. 기준 없이 세 번 / 기준 붙여 세 번 ---------- */
	var h2=el("div","bh");h2.style.marginTop="22px";

		"요즘 뜨는 그곳, 인생 국수를 만나다. 놓치면 후회하는 맛집",
		"1994년 개업, 3대째 내려오는 정통 국수 전문점입니다."
	];
	var BOUND=[
		"1994년에 문을 연 골목 안쪽 국숫집입니다. 점심에만 엽니다.",
		"골목 안쪽에 있는 오래된 국숫집입니다. 메뉴는 세 가지입니다.",
		"1994년부터 점심에만 문을 여는 국숫집입니다. 메뉴는 세 가지입니다."
	];

	var batchFb=el("div","fb");root.appendChild(batchFb);

	function runBatch(){
		batchBox.innerHTML="";
		var totals=[0,0];
		[["기준을 주지 않고 요청",FREE,0],["기준을 함께 주고 요청",BOUND,1]].forEach(function(grp){
			var wrap=el("div");wrap.style.marginTop="14px";
			var gh=el("div","note");
			wrap.appendChild(gh);
			grp[1].forEach(function(txt,i){
				var hits=inspect(txt);
				totals[grp[2]]+=hits.length;
				var card=el("div","taskcard");
				var t=el("div","tt");t.innerHTML="<span class='term'>"+(i+1)+"번째</span> "+mark(txt,hits);
				card.appendChild(t);
				var w=el("div","why show");
				w.innerHTML=hits.length
					? "<b>기준을 어긴 곳 "+hits.length+"군데</b> · "+hits.map(function(h){return h.t;}).join(" · ")
					: "<b>기준을 모두 지켰습니다.</b>";
				card.appendChild(w);
				card.style.borderColor=hits.length?cv("--sig"):cv("--ok");
				wrap.appendChild(card);
			});
			gh.innerHTML="<b>"+grp[0]+"</b> — 어긴 곳 모두 "+totals[grp[2]]+"군데";
			batchBox.appendChild(wrap);
		});
		batchFb.className="fb show "+(totals[0]>totals[1]?"ok":"no");
		batchFb.innerHTML=totals[0]>totals[1]
			? "<b>차이가 보입니다.</b> 기준 없이 요청한 세 개는 말투도 내용도 제각각이고, 확인되지 않은 숫자가 섞여 있습니다. 기준을 함께 준 세 개는 같은 방향으로 모입니다.<br><br>AI가 매번 다르게 만드는 것은 고장이 아닙니다. <b>확률로 고르기 때문에 원래 그렇습니다.</b> 그래서 한 방향으로 모으려면 <b>요청할 때마다 같은 기준을 함께 넘겨야</b> 합니다."
			: "<b>기준을 더 촘촘히 적어 보세요.</b> 지금 기준으로는 두 무리의 차이가 잘 드러나지 않습니다. 쓰지 않을 단어를 더 넣거나, 확인된 사실을 줄여 보세요.";
	}

	/* ---------- 3. 내 문구 검사 ---------- */
	var h3=el("div","bh");h3.style.marginTop="22px";
	h3.appendChild(el("span","tag c","STEP C"));h3.appendChild(el("h3",null,"내가 만든 문구 검사하기"));
	root.appendChild(h3);
	root.appendChild(el("p","lead","AI에게 받은 문구를 붙여넣으면 기준을 지켰는지 글자 단위로 확인합니다."));
	var ta=document.createElement("textarea");
	ta.className="txtin";ta.rows=3;ta.style.resize="vertical";
	ta.placeholder="AI가 만들어 준 문구를 여기에 붙여넣으세요.";
	ta.value="20년 전통! 창원 최고의 국숫집, 하루 500그릇 판매!";
	root.appendChild(ta);
	var brow=el("div","btnrow");
	var go=el("button","btn","기준 지켰는지 검사하기");
	brow.appendChild(go);root.appendChild(brow);
	var res=el("div");res.style.marginTop="14px";root.appendChild(res);
	function check(){
		var text=ta.value;
		res.innerHTML="";
		if(!text.trim()){res.appendChild(el("div","note","문구를 붙여넣어 주세요."));return;}
		var hits=inspect(text);
		var card=el("div","taskcard");
		var body=el("div","tt");body.innerHTML=mark(text,hits);
		card.appendChild(body);
		var w=el("div","why show");
		if(hits.length){
			w.innerHTML="<b>기준을 어긴 곳 "+hits.length+"군데</b><br>"+hits.map(function(h){return "· "+h.t;}).join("<br>")+
				"<br><br>조금 부풀려 말하는 것과 <b>없는 사실을 만드는 것</b>은 다릅니다. 숫자와 연도는 반드시 확인된 사실 안에 있어야 합니다.";
			card.style.borderColor=cv("--sig");
		}else{
			w.innerHTML="<b>기준을 모두 지켰습니다.</b> 쓰지 않기로 한 단어가 없고, 숫자도 확인된 사실 안에 있습니다.";
			card.style.borderColor=cv("--ok");
		}
		card.appendChild(w);res.appendChild(card);
	}
	go.addEventListener("click",check);
	runBatch();check();
};

	}
	draw();

		{w:11,q:"결과를 한 방향으로 모으는 방법은?",o:["요청할 때마다 같은 기준을 함께 넘긴다","도구를 하나로 줄인다","한 번만 요청한다","길게 요청한다"],a:0},

		{w:12,q:"AI가 스스로 말한 이유를 믿을 수 없는 까닭은?",o:["그 설명도 새로 만든 문장이라서","말이 짧아서","기록이 지워져서","사람이 못 읽어서"],a:0},
		{w:12,q:"출처를 확인하는 올바른 방법은?",o:["링크를 열어 직접 맞춰 본다","개수를 센다","형식을 본다","AI에게 다시 묻는다"],a:0},
		{w:13,q:"AI에게 맡겨도 되는 일의 조건은?",o:["틀렸을 때 내가 알아챌 수 있는 일","시간이 오래 걸리는 일","어려운 일","싫은 일"],a:0},
		{w:14,q:"AI가 일자리에 주는 영향은?",o:["과업 단위로 다시 나뉜다","직업이 통째로 사라진다","아무 변화 없다","임금만 오른다"],a:0}
	];

					res.className="fb show "+(score>=8?"ok":"no");

		});

	});
